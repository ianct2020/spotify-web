<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>banco siempre-y-play — el chip «Siempre» y el ▶ de la ficha, con un historial de mentira</title>
<style>html,body{margin:0;background:#111;color:#eee;font:13px system-ui}iframe{border:0;display:block}</style>
</head><body>
<pre id="progreso"></pre>
<div id="marcos"></div>
<script type="module">
// ── Qué prueba este banco (v=360, tanda 119) ─────────────────────────────────
//
// La app ENTERA (`siempre-y-play-caso.html`, uno por iframe), con la Spotify y el iTunes simulados y un historial INVENTADO:
//
//   A. `#wrapped`: el chip «Siempre» primero; elegirlo pinta la tarjeta de siempre arriba y ni la del año ni la apertura
//      (y la apertura viva queda desmontada: sin `.wr-con-apertura`); 0 peticiones al elegir; volver a un año, todo de vuelta.
//   B. la ficha de un artista con 5 temas: el ▶ de la fila 2 suena (el pill dice su nombre), la fila 2 en ⏸ y `#ac-preview`
//      en «▶ Preview»; la ficha de canción no se abrió; 0 peticiones a Spotify por el botón; el ▶ del artista después: ninguna
//      fila en ⏸. Un tema que no está en ningún proveedor: su fila deshabilitada, con «Sin preview», y ningún toast.
//   C. un artista con 2 temas, dos botones; uno con 1, un botón, que suena, dice «Parar preview de…» y vuelve a ▶ al pararlo;
//      uno con 0, ninguno y la vista sin errores.
//   D. a 1366×591 y 390×844, ningún desborde en `#ac-top-tracks` ni en la barra de años.
//   E. (v=361, tanda 120) el chip elegido de la barra, un año y «Siempre», en los cuatro presets: el texto ≥ 4,5:1 contra su fondo
//      compuesto capa por capa, con las transiciones terminadas, en reposo y con la regla de `:hover`; y el anillo del acento,
//      que un chip sin elegir no tiene. Junta todos los fallos antes de tirar: contra v=360, el texto cae en Ámbar y Aguamarina.
//   F. (v=362, tanda 121) elegir «Siempre», con las animaciones prendidas, monta el recorrido con sus cinco pasos y 0 peticiones a
//      cualquier host desde el clic (con el historial de este banco, sin tapas remotas: las tapas son la puerta K).
//   G. volver a un año monta el recorrido del año, con el mismo HTML que antes de pasar por «Siempre».
//   H. salir de `#wrapped` a mitad, con el módulo de la apertura retenido: no se escribe en la ruta nueva; y al volver, el recorrido.
//   I. con las animaciones en «nunca», la lista quieta: los pasos visibles y los números ya puestos.
//   J. sin desborde a 1366×591 y 390×844: ni la página ni ningún paso clavado (`overflow: hidden` recortaría sin avisar).
//   K. con una `img` remota, qué pide elegir «Siempre» desde el clic, medido: nada a Spotify, a iTunes ni a `/data/`, y a otro host
//      solo esa tapa. ⚠️ La tarjeta «DE SIEMPRE» ya lleva esa misma tapa desde v=360 (`renderAllTime()`, con el `sha256` fijado), así que
//      el «0» de la tabla de costos nunca midió una tapa: A corre con `img: null`. K deja el número a la vista en el resumen.
//
// 🔴 Si T119b se cae por tiempo, B y C (y la parte de D de la ficha) se van con ella. `?solo=A,D` corre esas.
// ⚠️ Todas las esperas van con `esperarReal` (ver PRESUPUESTO en `scripts/correr-banco.mjs`).

import { esperarReal, anclar } from '/banco/simulado.mjs';
import { fallar, listo } from '/banco/esperar.mjs';
import { TEMAS_CINCO, SIN_PREVIEW, ARTISTA_UNO, TEMA_UNO } from '/banco/siempre-y-play-datos.mjs';

const afirmar = (c, msg) => { if (!c) throw new Error('BANCO: ' + msg); };
const pasos = [];
const progreso = (t) => { pasos.push(`${t} @${Math.round(performance.now())}`); document.getElementById('progreso').textContent = pasos.join(' · '); };
const VUELTAS = 20000;
const SOLO = (new URLSearchParams(location.search).get('solo') || '').split(',').filter(Boolean);
const corre = (g) => !SOLO.length || SOLO.includes(g);

function abrirMarco(nombre, ancho, alto, extra = '') {
  const f = document.createElement('iframe');
  f.width = ancho; f.height = alto;
  f.src = `/banco/siempre-y-play-caso.html?marco=${nombre}${extra}`;
  document.getElementById('marcos').appendChild(f);
  return f;
}
const win = (f) => f.contentWindow;
const $ = (f, s) => f.contentDocument?.querySelector(s);
const $$ = (f, s) => [...(f.contentDocument?.querySelectorAll(s) || [])];
const arrancado = (f, que) => esperarReal(() => win(f)?.__listo, { que: `que arranque ${que}`, vueltas: VUELTAS });
const llamadas = (f) => win(f).__sim.reg.llamadas;
const aSpotify = (lista) => lista.filter((l) => !/^https?:/.test(l.ruta));
const recursosRed = (f) => win(f).performance.getEntriesByType('resource').length;
const enPausa = (b) => !!b.querySelector('rect') || b.innerHTML.includes('M6 ') || b.dataset.sonando === '1';

async function abrirWrapped(f, que) {
  win(f).location.hash = '#wrapped';
  await esperarReal(() => $(f, '#wrapped-year-card .wrapped-hero') && $(f, '.wrapped-year-tab.active'), { que: `#wrapped (${que})`, vueltas: VUELTAS });
}
async function abrirFicha(f, nombre, filas) {
  $$(f, '[data-close-modal]').forEach((b) => b.click());
  await esperarReal(() => !$(f, '.ac-modal'), { que: 'que se cierre la ficha anterior', vueltas: VUELTAS });
  win(f).__abrirFicha(nombre);
  await esperarReal(() => filas === 0
    ? $(f, '#ac-top-tracks')?.textContent.includes('Sin tracks puntuales')
    : $$(f, '#ac-top-tracks .wrapped-top-row').length === filas, { que: `la ficha de ${nombre}`, vueltas: VUELTAS });
}

const datos = {};
const marcos = [];
try {
  if (corre('A')) {
    const f = abrirMarco('a', 1366, 591); marcos.push(['a', f]);
    await arrancado(f, 'A');
    await abrirWrapped(f, 'A');
    const fila = $$(f, '#wrapped-year-tabs .wrapped-year-tab');
    afirmar(fila[0]?.dataset.siempre !== undefined, `A: el primero de la barra es «Siempre» (es «${fila[0]?.textContent.trim()}»)`);
    afirmar(fila[0].textContent.trim() === 'Siempre', 'A: dice «Siempre»');
    afirmar($(f, '.wrapped-year-tab.active')?.dataset.year === '2024', 'A: por defecto, el año más nuevo');
    const conApertura = !!$(f, '#wrapped-apertura .wr-ap');
    const l0 = llamadas(f).length, r0 = recursosRed(f), json0 = win(f).__datosAjenos.length;
    fila[0].click();
    await esperarReal(() => $(f, '[data-siempre].active'), { que: 'A: «Siempre» elegido', vueltas: VUELTAS });
    afirmar($(f, '#wrapped-alltime .wrapped-hero-year')?.textContent === 'DE SIEMPRE', 'A: la tarjeta «DE SIEMPRE» está');
    afirmar($(f, '#wrapped-year-card').innerHTML === '', 'A: #wrapped-year-card vacío');
    // 🔁 v=362 (tanda 121): hasta v=361 afirmaba `#wrapped-apertura` vacío, ningún `.wr-con-apertura` y la tarjeta pegada a la barra,
    // porque el recorrido de siempre no existía. Ahora está arriba de la tarjeta. Este marco va en «nunca»: la lista quieta, y por eso
    // sin `.wr-con-apertura` (esa clase es de un recorrido armado: la puerta F). Que la del año se haya destruido lo mira el test en Node.
    afirmar(!!$(f, '#wrapped-apertura .wr-ap[aria-label="Recorrido de todo tu historial"]'), 'A: el recorrido de siempre, montado');
    afirmar(!$(f, '#wrapped-apertura .wr-ap[aria-label^="Recorrido del año"]'), 'A: y no el del año');
    afirmar(!$(f, '.wrapped-postal-btn'), 'A: sin postal');
    afirmar($$(f, '.wrapped-year-tab.active').length === 1, 'A: ningún año .active');
    const hero = $(f, '#wrapped-alltime .wrapped-hero').getBoundingClientRect(), cierre = $(f, '#wrapped-apertura .wr-ap-cierre').getBoundingClientRect();
    afirmar(hero.top >= cierre.bottom && hero.top - cierre.bottom < 80, `A: la tarjeta va justo debajo del recorrido (${(hero.top - cierre.bottom).toFixed(1)} px)`);
    const nuevas = llamadas(f).length - l0, json = win(f).__datosAjenos.length - json0;
    afirmar(nuevas === 0 && json === 0, `A: 0 peticiones al elegir (${nuevas} a Spotify o iTunes, ${json} a /data/)`);
    $(f, '.wrapped-year-tab[data-year="2022"]').click();
    await esperarReal(() => $(f, '.wrapped-year-tab.active')?.dataset.year === '2022' && $(f, '#wrapped-year-card .wrapped-hero-year')?.textContent === '2022', { que: 'A: volver a 2022', vueltas: VUELTAS });
    afirmar(!!$(f, '#wrapped-year-card .wrapped-postal-btn'), 'A: de vuelta en un año, la postal');
    afirmar(!!$(f, '#wrapped-alltime .wrapped-hero'), 'A: y la tarjeta de siempre debajo');
    afirmar(!conApertura || !!$(f, '#wrapped-apertura .wr-ap'), 'A: y la apertura');
    datos.a = { conApertura, nuevas, recursos: recursosRed(f) - r0 };
    progreso('A');
  }

  if (corre('B')) {
    const f = abrirMarco('b', 1366, 591); marcos.push(['b', f]);
    await arrancado(f, 'B');
    await abrirFicha(f, 'Banda Cinco Inventada', 5);
    const botones = () => $$(f, '#ac-top-tracks .ac-track-play');
    afirmar(botones().length === 5, `B: un ▶ por fila (${botones().length})`);
    const fichasAntes = $$(f, '.tc-modal, .track-card-modal').length;
    const modales0 = $$(f, '.modal').length;
    const l0 = llamadas(f).length;
    win(f).document.getElementById('ac-preview').textContent = '⏹ Parar';
    botones()[1].click();
    await esperarReal(() => $(f, '.preview-pill.is-playing'), { que: 'B: la fila 2 suena', vueltas: VUELTAS });
    const label = $(f, '.preview-pill-label')?.textContent || '';
    afirmar(label.includes(TEMAS_CINCO[1]), `B: el pill dice el nombre del tema («${label}»)`);
    afirmar(botones()[1].dataset.sonando === '1' && enPausa(botones()[1]), 'B: la fila 2 en ⏸');
    afirmar(botones().filter((b) => b.dataset.sonando === '1').length === 1, 'B: las demás en ▶');
    afirmar(botones()[1].getAttribute('aria-label') === `Parar preview de ${TEMAS_CINCO[1]}`, `B: aria-label «Parar preview de…» (dice «${botones()[1].getAttribute('aria-label')}»)`);
    afirmar(botones()[1].title === 'Parar el preview', `B: title «Parar el preview» (dice «${botones()[1].title}»)`);
    const pv = win(f).document.getElementById('ac-preview').textContent;
    afirmar(pv === '▶ Preview', `B: #ac-preview en «▶ Preview» (dice «${pv}»)`);
    afirmar($$(f, '.modal').length === modales0 && $$(f, '.tc-modal, .track-card-modal').length === fichasAntes, 'B: la ficha de canción no se abrió');
    const hechas = llamadas(f).slice(l0);
    const spot = aSpotify(hechas);
    afirmar(spot.length === 0, `B: 0 peticiones a Spotify por el botón (${spot.map((x) => x.ruta).join(', ')})`);
    afirmar(hechas.length >= 1 && hechas.every((x) => x.ruta.startsWith('https://itunes.apple.com/')), 'B: lo único que salió es la búsqueda en iTunes');
    afirmar(win(f).__audios.at(-1)?.includes(encodeURIComponent(TEMAS_CINCO[1])), 'B: suena el preview de ese tema');
    datos.b = { itunes: hechas.length, spotify: spot.length };

    // El ▶ del artista: ninguna fila queda en ⏸. Su preview es `ac:` y el iTunes simulado no tiene al artista: el
    // `togglePreview` termina en null, y por el camino la fila 2 tiene que soltar el ⏸ igual.
    win(f).document.getElementById('ac-preview').click();
    await esperarReal(() => botones().every((b) => b.dataset.sonando !== '1'), { que: 'B: suena el artista, ninguna fila en ⏸', vueltas: VUELTAS });

    // Sin preview.
    const iSin = TEMAS_CINCO.indexOf(SIN_PREVIEW);
    const toasts0 = $$(f, '.toast').length;
    botones()[iSin].click();
    await esperarReal(() => botones()[iSin].disabled, { que: 'B: la fila sin preview se deshabilita', vueltas: VUELTAS });
    afirmar(botones()[iSin].title === 'Sin preview' && botones()[iSin].getAttribute('aria-label') === 'Sin preview', 'B: title y aria-label «Sin preview»');
    afirmar($$(f, '.toast').length === toasts0, 'B: ningún toast');
    afirmar(botones().filter((b) => b.disabled).length === 1, 'B: solo esa');
    progreso('B');
  }

  if (corre('C')) {
    const f = abrirMarco('c', 1366, 591); marcos.push(['c', f]);
    await arrancado(f, 'C');
    await abrirFicha(f, 'Dúo Dos Inventado', 2);
    afirmar($$(f, '#ac-top-tracks .ac-track-play').length === 2, 'C: con 2 temas, dos botones');
    await abrirFicha(f, ARTISTA_UNO, 1);
    const solos = $$(f, '#ac-top-tracks .ac-track-play');
    afirmar(solos.length === 1, `C: con 1 tema, un botón (${solos.length})`);
    afirmar(solos[0].getAttribute('aria-label') === `Escuchar preview de ${TEMA_UNO}`, 'C: con 1 tema, nace en «Escuchar preview de…»');
    solos[0].click();
    await esperarReal(() => $(f, '.preview-pill.is-playing'), { que: 'C: el único tema suena', vueltas: VUELTAS });
    afirmar(solos[0].dataset.sonando === '1' && enPausa(solos[0]), 'C: con 1 tema, la fila en ⏸');
    afirmar(solos[0].getAttribute('aria-label') === `Parar preview de ${TEMA_UNO}`, `C: con 1 tema, aria-label «Parar preview de…» (dice «${solos[0].getAttribute('aria-label')}»)`);
    solos[0].click();
    await esperarReal(() => solos[0].dataset.sonando === '0', { que: 'C: el único tema se para', vueltas: VUELTAS });
    afirmar(solos[0].getAttribute('aria-label') === `Escuchar preview de ${TEMA_UNO}`, 'C: al pararlo, vuelve a «Escuchar preview de…»');
    afirmar(!$(f, '.preview-pill.is-playing'), 'C: al pararlo, el pill deja de sonar');
    await abrirFicha(f, 'Artista Sin Temas Inventado', 0);
    afirmar($$(f, '.ac-track-play').length === 0, 'C: con 0, ninguno');
    progreso('C');
  }

  if (corre('D')) {
    const res = [];
    for (const [ancho, alto] of [[1366, 591], [390, 844]]) {
      const f = abrirMarco(`d${ancho}`, ancho, alto); marcos.push([`d${ancho}`, f]);
      await arrancado(f, `D ${ancho}`);
      await abrirWrapped(f, `D ${ancho}`);
      const tabs = $(f, '#wrapped-year-tabs'), bar = $(f, '.wrapped-year-bar');
      afirmar(tabs.scrollWidth <= tabs.clientWidth, `D ${ancho}: la barra de años no desborda (${tabs.scrollWidth} > ${tabs.clientWidth})`);
      afirmar(bar.scrollWidth <= bar.clientWidth, `D ${ancho}: .wrapped-year-bar no desborda (${bar.scrollWidth} > ${bar.clientWidth})`);
      const de = f.contentDocument.documentElement;
      afirmar(de.scrollWidth <= win(f).innerWidth, `D ${ancho}: la página no desborda (${de.scrollWidth} > ${win(f).innerWidth})`);
      let medida = `barra ${tabs.scrollWidth}/${tabs.clientWidth}`;
      if (corre('B')) {
        await abrirFicha(f, 'Banda Cinco Inventada', 5);
        const t = $(f, '#ac-top-tracks');
        afirmar(t.clientWidth > 0, `D ${ancho}: #ac-top-tracks tiene ancho`);
        afirmar(t.scrollWidth <= t.clientWidth, `D ${ancho}: #ac-top-tracks no desborda (${t.scrollWidth} > ${t.clientWidth})`);
        for (const b of $$(f, '#ac-top-tracks .ac-track-play')) {
          const r = b.getBoundingClientRect(), fr = b.closest('.wrapped-top-row').getBoundingClientRect();
          afirmar(r.left >= fr.left && r.right <= fr.right, `D ${ancho}: el ▶ entra en su fila`);
          afirmar(r.width >= 28 && r.height >= 28, `D ${ancho}: el ▶ se puede tocar (${r.width}×${r.height})`);
        }
        const nombre = $$(f, '#ac-top-tracks .wrapped-top-name').at(-1).getBoundingClientRect();
        afirmar(nombre.width > 40, `D ${ancho}: el nombre conserva ancho (${nombre.width.toFixed(0)})`);
        medida += `, tracks ${t.scrollWidth}/${t.clientWidth}, nombre ${nombre.width.toFixed(0)}`;
      }
      res.push(`${ancho}: ${medida}`);
    }
    datos.d = res.join(' · ');
    progreso('D');
  }

  if (corre('E')) {
    const f = abrirMarco('e', 1366, 591); marcos.push(['e', f]);
    await arrancado(f, 'E');
    await abrirWrapped(f, 'E');
    // La cuenta de WCAG 2.x y la composición de capas de la puerta 10 de `puertas.html`, las mismas.
    const rgbaDe = (css) => { const m = String(css).match(/rgba?\(([^)]+)\)/); if (!m) return null; const p = m[1].split(/[\s,/]+/).filter(Boolean).map(Number); return [p[0], p[1], p[2], p[3] ?? 1]; };
    const lumDe = (c) => { const [r, g, b] = c.slice(0, 3).map((v) => { const s = v / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
    const contrasteDe = (a, b) => { const x = lumDe(a), y = lumDe(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
    const sobre = (arriba, abajo) => { const a = arriba[3]; return [0, 1, 2].map((i) => arriba[i] * a + abajo[i] * (1 - a)).concat(1); };
    const cs = (el) => win(f).getComputedStyle(el);
    function fondoDe(el) {
      const capas = [];
      for (let n = el; n && n.nodeType === 1; n = n.parentElement) { const c = rgbaDe(cs(n).backgroundColor); if (c && c[3] > 0) { capas.push(c); if (c[3] >= 1) break; } }
      let base = capas.length && capas.at(-1)[3] >= 1 ? capas.pop() : [255, 255, 255, 1];
      while (capas.length) base = sobre(capas.pop(), base);
      return base;
    }
    const ratioDe = (el) => { const fondo = fondoDe(el), c = rgbaDe(cs(el).color); return contrasteDe(sobre([c[0], c[1], c[2], c[3] * Number(cs(el).opacity || 1)], fondo), fondo); };
    // 🔴 Con las transiciones terminadas: el chip anima `color` y `background`, y a mitad de camino da otro número (la trampa del 09/10).
    const terminar = (el) => { cs(el).color; el.getAnimations().forEach((a) => a.finish()); };
    const acentoDe = (padre) => { const d = f.contentDocument.createElement('div'); d.style.color = 'var(--color-accent)'; d.style.transition = 'none'; padre.appendChild(d); const v = cs(d).color; d.remove(); return v; };
    const reglas = [...f.contentDocument.styleSheets].flatMap((h) => { try { return [...h.cssRules]; } catch { return []; } });
    const reglaDe = (sel) => reglas.find((r) => r.selectorText === sel);
    // Un `.click()` no pone `:hover`: se pinta un clon con las declaraciones de la regla de `:hover`, resueltas con el tema de ahora.
    // Sin esa regla, el hover de una elegida no hace nada, siempre que `.active` vaya DESPUÉS del `:hover` general (misma especificidad).
    const hoverGeneral = reglas.indexOf(reglaDe('.wrapped-year-tab:hover')), elegida = reglas.indexOf(reglaDe('.wrapped-year-tab.active'));
    afirmar(hoverGeneral >= 0 && elegida > hoverGeneral, 'E: .wrapped-year-tab.active va después de .wrapped-year-tab:hover');
    function ratioHover(el) {
      const r = reglaDe('.wrapped-year-tab.active:hover');
      if (!r) return ratioDe(el);
      const clon = el.cloneNode(true);
      clon.style.cssText = r.style.cssText + ';transition:none';
      el.parentElement.appendChild(clon);
      const v = ratioDe(clon);
      clon.remove();
      return v;
    }
    const fallos = [], medidos = [];
    const chips = [['año', () => $(f, '.wrapped-year-tab[data-year="2024"]')], ['Siempre', () => $(f, '.wrapped-year-tab[data-siempre]')]];
    for (const id of ['violeta', 'ambar', 'aguamarina', 'papel']) {
      await anclar(win(f).__ponerTema(id));
      let peor = Infinity;
      for (const [nombre, chip] of chips) {
        chip().click();
        await esperarReal(() => chip()?.classList.contains('active'), { que: `E: ${nombre} elegido en ${id}`, vueltas: VUELTAS });
        const el = chip();
        terminar(el);
        const reposo = ratioDe(el), hover = ratioHover(el);
        peor = Math.min(peor, reposo, hover);
        if (reposo < 4.5) fallos.push(`${id} ${nombre} en reposo ${reposo.toFixed(2)}:1`);
        if (hover < 4.5) fallos.push(`${id} ${nombre} con :hover ${hover.toFixed(2)}:1`);
        // Se distingue de una sin elegir sin depender del color del texto: el anillo del acento.
        const acento = acentoDe(el.parentElement), otro = $$(f, '.wrapped-year-tab:not(.active)')[0];
        terminar(otro);
        const anillo = cs(el).boxShadow.includes(acento) && /\b0px 0px 0px 2px\b/.test(cs(el).boxShadow) && cs(el).borderTopColor === acento;
        if (!anillo) fallos.push(`${id} ${nombre} sin el anillo de 2 px del acento (${cs(el).boxShadow})`);
        if (cs(otro).boxShadow !== 'none') fallos.push(`${id}: un chip sin elegir lleva anillo (${cs(otro).boxShadow})`);
      }
      medidos.push(`${id} ${peor.toFixed(2)}`);
    }
    await anclar(win(f).__ponerTema('violeta'));
    afirmar(fallos.length === 0, `E: ${fallos.join(' · ')}`);
    datos.e = medidos.join(', ');
    progreso('E');
  }

  // ── El recorrido de «Siempre» (v=362, tanda 121) ───────────────────────────────
  const CINCO = 'horas,anios,artista,album,racha';
  const RECORRIDO = '#wrapped-apertura .wr-ap[aria-label="Recorrido de todo tu historial"]';
  const idsDe = (f) => $$(f, '#wrapped-apertura .wr-ap-paso').map((p) => p.dataset.id).join();
  const siempre = async (f, que) => {
    $(f, '[data-siempre]').click();
    await esperarReal(() => $(f, '[data-siempre].active') && $(f, '#wrapped-alltime .wrapped-hero-year'), { que: `${que}: «Siempre» elegido`, vueltas: VUELTAS });
  };
  // Unas vueltas con red de verdad (la del propio banco) para que lo que el clic haya pedido llegue a `performance`.
  const reposar = async (vueltas = 30) => { for (let i = 0; i < vueltas; i++) await anclar(fetch('/banco/esperar.mjs', { cache: 'no-store' }).then((r) => r.text())); };
  const nombresRecursos = (f) => win(f).performance.getEntriesByType('resource').map((e) => e.name);

  if (corre('F')) {
    const f = abrirMarco('f', 1366, 591, '&hist=recorrido&anim=siempre'); marcos.push(['f', f]);
    await arrancado(f, 'F');
    await abrirWrapped(f, 'F');
    const l0 = llamadas(f).length, r0 = nombresRecursos(f).length, json0 = win(f).__datosAjenos.length;
    await siempre(f, 'F');
    await reposar();
    const nuevas = llamadas(f).length - l0, json = win(f).__datosAjenos.length - json0, recursos = nombresRecursos(f).slice(r0);
    afirmar(nuevas === 0 && json === 0 && recursos.length === 0, `F: 0 peticiones a cualquier host (${nuevas} a Spotify o iTunes, ${json} a /data/, ${recursos.length} recursos: ${recursos.join(' · ')})`);
    afirmar(!!$(f, RECORRIDO), 'F: el recorrido de siempre, montado');
    afirmar(idsDe(f) === CINCO, `F: los cinco pasos, en orden (${idsDe(f)})`);
    afirmar($(f, RECORRIDO).classList.contains('js'), 'F: armado, con `.js`');
    afirmar($(f, '#wrapped-slide').classList.contains('wr-con-apertura'), 'F: wr-con-apertura en el contenedor');
    afirmar($(f, '.wr-ap-paso[data-id="horas"]').classList.contains('on'), 'F: arranca en el primer paso');
    afirmar(!$(f, '.wr-ap-saltar').hidden && !$(f, '.wr-ap-prog').hidden, 'F: «Saltar al resumen ↓» y los puntos');
    afirmar($$(f, '.wr-ap-info').length === 2, `F: el ⓘ en las horas y en los años (${$$(f, '.wr-ap-info').length})`);
    datos.f = { peticiones: nuevas + json + recursos.length };
    progreso('F');
  }

  if (corre('G')) {
    const f = abrirMarco('g', 1366, 591, '&hist=recorrido'); marcos.push(['g', f]);
    await arrancado(f, 'G');
    await abrirWrapped(f, 'G');
    const antes = $(f, '#wrapped-apertura').innerHTML;
    afirmar(/aria-label="Recorrido del año 2024"/.test(antes), 'G: de entrada, el recorrido del año');
    await siempre(f, 'G');
    afirmar(!!$(f, RECORRIDO), 'G: pasa por el recorrido de siempre');
    $(f, '.wrapped-year-tab[data-year="2024"]').click();
    await esperarReal(() => $(f, '.wrapped-year-tab.active')?.dataset.year === '2024' && $(f, '#wrapped-apertura .wr-ap[aria-label="Recorrido del año 2024"]'), { que: 'G: volver a 2024', vueltas: VUELTAS });
    afirmar($(f, '#wrapped-apertura').innerHTML === antes, 'G: el HTML del recorrido del año es el mismo que antes de pasar por «Siempre»');
    progreso('G');
  }

  if (corre('H')) {
    const f = abrirMarco('h', 1366, 591, '&hist=recorrido&retener=1'); marcos.push(['h', f]);
    await arrancado(f, 'H');
    await abrirWrapped(f, 'H');   // Con el módulo retenido, `cargarApertura()` se rinde a los 3 s y el Wrapped sale sin recorrido.
    afirmar(!$(f, '.wr-ap'), 'H: el módulo está retenido: sin recorrido');
    $(f, '[data-siempre]').click();   // `render()` vuelve a esperar el `import()`: acá la ruta se va con el render a medias.
    win(f).location.hash = '#home';
    await esperarReal(() => $(f, '.home-card'), { que: 'H: #home', vueltas: VUELTAS });
    const html = $(f, '#main-content').innerHTML;
    win(f).__soltarApertura();
    const t0 = win(f).performance.now();
    await esperarReal(() => win(f).performance.now() - t0 > 3500, { que: 'H: que pase la espera del módulo', vueltas: VUELTAS });
    afirmar($(f, '#main-content').innerHTML === html, 'H: al soltarlo, no se escribe en la ruta nueva');
    afirmar(!$(f, '.wr-ap') && !$(f, '.wr-con-apertura') && !$(f, '#wrapped-content'), 'H: ni recorrido ni nada del Wrapped en #home');
    win(f).location.hash = '#wrapped';
    await esperarReal(() => $(f, '#wrapped-alltime .wrapped-hero-year') && $(f, '[data-siempre].active'), { que: 'H: volver a #wrapped', vueltas: VUELTAS });
    afirmar(!!$(f, RECORRIDO), 'H: al volver, con el módulo ya cargado, el recorrido de siempre');
    progreso('H');
  }

  if (corre('I')) {
    const f = abrirMarco('i', 1366, 591, '&hist=recorrido'); marcos.push(['i', f]);
    await arrancado(f, 'I');
    await abrirWrapped(f, 'I');
    await siempre(f, 'I');
    afirmar(!!$(f, RECORRIDO), 'I: el recorrido de siempre, montado');
    afirmar(!$(f, RECORRIDO).classList.contains('js') && !$(f, '.wr-con-apertura'), 'I: sin `.js` ni wr-con-apertura: la lista');
    afirmar(idsDe(f) === CINCO, `I: los cinco pasos (${idsDe(f)})`);
    for (const p of $$(f, '#wrapped-apertura .wr-ap-paso')) {
      const cs = win(f).getComputedStyle(p);
      afirmar(cs.opacity === '1' && p.getBoundingClientRect().height > 40, `I: ${p.dataset.id} a la vista (opacidad ${cs.opacity}, alto ${p.getBoundingClientRect().height})`);
    }
    afirmar($(f, '.wr-ap-prog').hidden && $(f, '.wr-ap-saltar').hidden, 'I: sin puntos ni «Saltar»: no hay nada que saltar');
    // 167.000 min = 2.783h 20m, escrito a mano: los números ya puestos, sin ningún contador corriendo.
    afirmar($(f, '.wr-ap-paso[data-id="horas"] .wr-ap-num').textContent === '2783h 20m', `I: el total, puesto («${$(f, '.wr-ap-paso[data-id="horas"] .wr-ap-num').textContent}»)`);
    const barras = $$(f, '.wr-ap-paso[data-id="anios"] .wr-ap-barra');
    afirmar(barras.length === 4 && barras.every((b) => b.getBoundingClientRect().height > 0), 'I: las cuatro barras, con su alto');
    afirmar($$(f, '.wr-ap-fila .b').every((b) => b.getBoundingClientRect().width > 0), 'I: las barras del ranking, con su ancho');
    progreso('I');
  }

  if (corre('J')) {
    const res = [];
    for (const [ancho, alto] of [[1366, 591], [390, 844]]) {
      const f = abrirMarco(`j${ancho}`, ancho, alto, '&hist=recorrido&anim=siempre'); marcos.push([`j${ancho}`, f]);
      await arrancado(f, `J ${ancho}`);
      await abrirWrapped(f, `J ${ancho}`);
      await siempre(f, `J ${ancho}`);
      afirmar(!!$(f, RECORRIDO), `J ${ancho}: el recorrido de siempre, montado`);
      const de = f.contentDocument.documentElement;
      afirmar(de.scrollWidth <= win(f).innerWidth, `J ${ancho}: la página no desborda (${de.scrollWidth} > ${win(f).innerWidth})`);
      let holgura = Infinity;
      for (const p of $$(f, '#wrapped-apertura .wr-ap-paso')) {
        afirmar(p.scrollHeight <= p.clientHeight, `J ${ancho}: ${p.dataset.id} entra de alto (${p.scrollHeight} > ${p.clientHeight})`);
        afirmar(p.scrollWidth <= p.clientWidth, `J ${ancho}: ${p.dataset.id} entra de ancho (${p.scrollWidth} > ${p.clientWidth})`);
        holgura = Math.min(holgura, p.clientHeight - p.scrollHeight);
      }
      res.push(`${ancho}: holgura ${holgura}`);
    }
    datos.j = res.join(' · ');
    progreso('J');
  }

  if (corre('K')) {
    const f = abrirMarco('k', 1366, 591, '&hist=recorrido&anim=siempre&tapa=remota'); marcos.push(['k', f]);
    await arrancado(f, 'K');
    await abrirWrapped(f, 'K');
    const l0 = llamadas(f).length, r0 = nombresRecursos(f).length, json0 = win(f).__datosAjenos.length;
    await siempre(f, 'K');
    await reposar();
    const nuevas = llamadas(f).length - l0, json = win(f).__datosAjenos.length - json0, recursos = nombresRecursos(f).slice(r0);
    const ajenas = recursos.filter((u) => !u.includes('tapas-inventadas.invalid'));
    const medido = `${nuevas} a Spotify o iTunes, ${json} a /data/, ${recursos.length} recursos (${ajenas.length} que no son la tapa), recorrido ${$(f, RECORRIDO) ? 'montado' : 'NO montado'}`;
    afirmar(nuevas === 0 && json === 0 && ajenas.length === 0, `K: solo la tapa (${medido})`);
    afirmar(!!$(f, RECORRIDO), `K: el recorrido de siempre, montado (${medido})`);
    afirmar($(f, '.wr-ap-paso[data-id="album"] img.wr-ap-tapa')?.getAttribute('src')?.includes('tapas-inventadas.invalid'), `K: el paso del disco lleva la tapa (${medido})`);
    datos.k = medido;
    progreso('K');
  }

  const errores = marcos.flatMap(([n, f]) => win(f).__errores.map((e) => `${n}: ${e}`));
  afirmar(errores.length === 0, `0 errores de consola: ${errores.join(' | ')}`);
  const ajenos = marcos.flatMap(([, f]) => win(f).__sim.reg.desconocidas);
  const resumen = `ok${datos.a ? ` · A elegir: ${datos.a.nuevas} peticiones, apertura ${datos.a.conApertura ? 'montada antes' : 'no montada'}` : ''}` +
    (datos.b ? ` · B: ${datos.b.itunes} a iTunes, ${datos.b.spotify} a Spotify` : '') +
    (datos.d ? ` · D ${datos.d}` : '') +
    (datos.e ? ` · E chip elegido, el peor por preset: ${datos.e}` : '') +
    (datos.f ? ` · F elegir: ${datos.f.peticiones} peticiones` : '') +
    (datos.j ? ` · J ${datos.j}` : '') +
    (datos.k ? ` · K con la tapa remota: ${datos.k}` : '') +
    ` · rutas sin simular=${ajenos.length} · errores=${errores.length} · reloj virtual=${Math.round(performance.now())} ms`;
  document.documentElement.setAttribute('data-resumen', resumen);
  document.getElementById('progreso').textContent = resumen;
  listo(resumen);
} catch (e) {
  fallar(e);
}
</script>
</body></html>
