<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>banco postal — la postal del año, con un historial de mentira</title>
<style>html,body{margin:0;background:#111;color:#eee;font:13px system-ui}iframe{border:0;display:block}</style>
</head><body>
<pre id="progreso"></pre>
<div id="marcos"></div>
<script type="module">
// ── Qué prueba este banco (v=326, tanda 73; v=327, tanda 74; la postal «El año en días», v=344, tanda 97) ─
//
// La postal del año de `#wrapped` REAL, en la app ENTERA (`postal-caso.html`, uno por iframe), contra la
// Spotify simulada (`simulado.mjs`, sin tocar) y un `history-stats.json` INVENTADO (`postal-datos.mjs`).
// Nada sale a la red. Desde v=344 la postal es la trama de días del año (sin tapas ni nombres):
//
//   A. abrir «Wrapped» = las mismas peticiones que antes (1 `/me` y nada más) y 0 del módulo de la postal
//      hasta apretar (de CONSERVACIÓN);
//   B. apretar «Descargar postal (PNG)»: sale UN PNG de 1080×1350 llamado `fonoteca-2025.png` (decodificado
//      acá), 0 a Spotify, 0 pedidos de tapa, los textos contados a mano y una casilla por día; y con 2024
//      (arranca el 15/06) los días de antes del tramo salen con el tono «fuera»;
//   D. ningún `fillText` con el ancho medido mayor que su máximo;
//   E. en los cuatro presets, el texto usa solo `--color-text` y `--color-text-secondary`; cada caja de
//      texto, en los PÍXELES del PNG, es solo el texto sobre su fondo (ningún día detrás) y el fondo leído
//      ahí da ≥ 4,6:1; y el centro de cada día es el tono que este banco calcula por su lado con los colores
//      del tema (y el pico, con el contorno del texto);
//   F. dos clics rápidos = una descarga;
//   G. salir de la ruta mientras espera la letra (retenida acá): 0 descargas, 0 avisos y 0 escrituras en el
//      DOM después del cambio de ruta;
//   H. a 1366×591 y 390×844, el botón entra en `.wrapped-hero` sin desbordar y la página no tiene barra
//      horizontal;
//   J. (v=344) con 2023, cuyas `img` tienen la forma del CDN: 0 pedidos a `/image/` desde que se aprieta;
//   y 0 errores de consola en todos los marcos.
//
// Se sacaron en v=344 C (tapas que fallan), I (`toBlob` que tira: el plan B sin tapas), la J de v=327 (la
// variante de 300) y K (la tapa que no contesta): la postal ya no pide tapas.
//
// `?solo=B,E` corre solo esas puertas (A siempre).
// ⚠️ Todas las esperas van con `esperarReal` (ver PRESUPUESTO en `scripts/correr-banco.mjs`).

import { esperarReal, anclar } from '/banco/simulado.mjs';
import { fallar, listo } from '/banco/esperar.mjs';
import { ESPERADO_2025 } from '/banco/postal-datos.mjs';

const afirmar = (c, msg) => { if (!c) throw new Error('BANCO: ' + msg); };
const pasos = [];
const progreso = (t) => { pasos.push(`${t} @${Math.round(performance.now())}`); document.getElementById('progreso').textContent = pasos.join(' · '); };
const VUELTAS = 20000;
const SOLO = (new URLSearchParams(location.search).get('solo') || '').split(',').filter(Boolean);
const corre = (g) => !SOLO.length || SOLO.includes(g);

function abrirMarco(nombre, ancho, alto) {
  const f = document.createElement('iframe');
  f.width = ancho; f.height = alto;
  f.src = `/banco/postal-caso.html?marco=${nombre}`;
  document.getElementById('marcos').appendChild(f);
  return f;
}
const win = (f) => f.contentWindow;
const $ = (f, s) => f.contentDocument?.querySelector(s);
const meDe = (f) => win(f).__sim.reg.llamadas.filter((l) => l.ruta === '/me').length;
const recursos = (f) => win(f).performance.getEntriesByType('resource').map((e) => e.name);
const moduloPostal = (f) => recursos(f).filter((u) => /wrapped-postal\.js|postal-anio\.js/.test(u));
async function arrancado(f, que) { await esperarReal(() => win(f)?.__listo, { que: `que arranque ${que}`, vueltas: VUELTAS }); }
const anioActivo = (f) => $(f, '.wrapped-year-tab.active')?.dataset.year;
async function abrirWrapped(f, que) {
  win(f).location.hash = '#wrapped';
  await esperarReal(() => $(f, '#wrapped-year-card .wrapped-hero') && anioActivo(f), { que: `que #wrapped pinte (${que})`, vueltas: VUELTAS });
}
async function elegirAnio(f, anio) {
  if (anioActivo(f) === String(anio)) return;
  $(f, `.wrapped-year-tab[data-year="${anio}"]`).click();
  await esperarReal(() => anioActivo(f) === String(anio) && $(f, '#wrapped-year-card .wrapped-hero-year')?.textContent === String(anio), { que: `el año ${anio}`, vueltas: VUELTAS });
}
const boton = (f) => $(f, '#wrapped-year-card .wrapped-hero .wrapped-postal-btn');

/** Aprieta el botón y espera la descarga entera. Devuelve lo que pasó en el medio. */
async function generar(f, que) {
  const b = boton(f);
  afirmar(b, `${que}: hay un botón .wrapped-postal-btn dentro de .wrapped-hero de la tarjeta del año`);
  const w = win(f);
  const d0 = w.__descargas.length, t0 = w.__toasts.length, p0 = w.__tapas.pedidas.length, l0 = w.__sim.reg.llamadas.length, r0 = recursos(f).length;
  const tClic = performance.now();
  b.click();
  const durante = { disabled: b.disabled, texto: b.textContent.trim() };
  await esperarReal(() => w.__descargas.length > d0 && w.__descargas.at(-1).bytes && w.__toasts.length > t0, { que: `${que}: la descarga y su aviso`, vueltas: VUELTAS });
  await esperarReal(() => boton(f) && !boton(f).disabled, { que: `${que}: el botón vuelve`, vueltas: VUELTAS });
  const desc = w.__descargas.slice(d0);
  const ms = Math.round(performance.now() - tClic);
  progreso(`${que}: generada en ${ms} ms de reloj`);
  return {
    ms, durante, despues: boton(f).textContent.trim(),
    descargas: desc, desc: desc[0], toasts: w.__toasts.slice(t0),
    tapas: w.__tapas.pedidas.slice(p0), spotify: w.__sim.reg.llamadas.slice(l0),
    recursos: recursos(f).slice(r0), dibujo: JSON.parse(JSON.stringify(w.__postalDibujo || null)),
  };
}

/** El PNG: firma, IHDR y los píxeles (decodificado acá, en la madre). */
async function leerPng(bytes) {
  const sig = [137, 80, 78, 71, 13, 10, 26, 10].every((v, i) => bytes[i] === v);
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const ihdr = String.fromCharCode(...bytes.slice(12, 16));
  const w = dv.getUint32(16), h = dv.getUint32(20);
  // Anclado: decodificar no es red, y sin el ancla el reloj virtual salta al próximo temporizador de la
  // app (el toast de 30 s) mientras tanto. Es la trampa de PRESUPUESTO en `scripts/correr-banco.mjs`.
  const bmp = await anclar(createImageBitmap(new Blob([bytes], { type: 'image/png' })));
  const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
  const x = c.getContext('2d'); x.drawImage(bmp, 0, 0);
  const datos = x.getImageData(0, 0, bmp.width, bmp.height).data;
  const px = (a, b) => { const k = (Math.round(b) * bmp.width + Math.round(a)) * 4; return [datos[k], datos[k + 1], datos[k + 2]]; };
  return { sig, ihdr, w, h, bw: bmp.width, bh: bmp.height, px };
}
const cerca = (a, b, tol = 8) => a.every((v, i) => Math.abs(v - b[i]) <= tol);
const hexA = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const aHex = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
// La cuenta de WCAG 2.x de `tests/tema-contraste.test.mjs`, la misma (los colores del tema son opacos).
const lum = (h) => { const [r, g, b] = hexA(h).map((v) => { const s = v / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const contraste = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
// Los tonos del diseño B, rehechos acá por su lado (no se leen del módulo).
const mix = (a, b, p) => aHex(hexA(a).map((v, i) => v * (1 - p) + hexA(b)[i] * p));
/** Un color CSS a `#rrggbb` con el mismo normalizador que usa el lienzo. */
function normal(f, css) { const x = f.contentDocument.createElement('canvas').getContext('2d'); x.fillStyle = '#000'; x.fillStyle = css.trim(); return x.fillStyle; }
const token = (f, k) => normal(f, win(f).getComputedStyle(f.contentDocument.documentElement).getPropertyValue(k));

/**
 * Cada píxel de la caja de un texto tiene que ser la tinta mezclada con el fondo (el antialias del lienzo
 * cae sobre esa recta): si un día asomara detrás, quedaría fuera. Devuelve cuántos no lo son y el contraste
 * de la tinta contra los píxeles que son fondo (a menos de 1,5 de valor del fondo puro: el redondeo a 8 bits), el
 * más bajo.
 */
function cajaContraPixeles(png, t, fondo) {
  const T = hexA(t.valor), B = hexA(fondo), d = T.map((v, i) => v - B[i]), dd = d.reduce((a, v) => a + v * v, 0) || 1;
  let raros = 0, min = Infinity, n = 0;
  for (let y = Math.max(0, Math.floor(t.caja.y)); y < Math.min(1350, Math.ceil(t.caja.y + t.caja.h)); y++) {
    for (let x = Math.max(0, Math.floor(t.caja.x)); x < Math.min(1080, Math.ceil(t.caja.x + t.caja.w)); x++) {
      const p = png.px(x, y);
      const a = Math.max(0, Math.min(1, p.reduce((s, v, i) => s + (v - B[i]) * d[i], 0) / dd));
      if (!cerca(p, B.map((v, i) => v + a * d[i]), 4)) raros++;
      if (a * Math.max(...d.map(Math.abs)) <= 1.5) { n++; min = Math.min(min, contraste(t.valor, aHex(p))); }
    }
  }
  return { raros, min, n };
}

const marcos = [];
const datos = {};
/** N vueltas de espera de verdad (cada una, una petición al propio banco: el reloj virtual no la deja atrás). */
async function margen(n) { let k = 0; await esperarReal(() => ++k > n, { que: 'un margen', vueltas: n + 10 }); }
try {
  // ── A · abrir, y nada del módulo de la postal ──────────────────────────────
  progreso('A: abrir');
  const A = abrirMarco('A', 1366, 900); marcos.push(['A', A]);
  await arrancado(A, 'el marco A');
  {
    const me0 = meDe(A), l0 = win(A).__sim.reg.llamadas.length, r0 = recursos(A).length;
    await abrirWrapped(A, 'A');
    const nuevas = win(A).__sim.reg.llamadas.slice(l0);
    const otrosOrigenes = recursos(A).slice(r0).filter((u) => new URL(u).origin !== location.origin);
    datos.abrir = { me: meDe(A) - me0, otras: nuevas.filter((l) => l.ruta !== '/me').length, recursos: recursos(A).length - r0, modulo: moduloPostal(A).length, otrosOrigenes: otrosOrigenes.length, tapas: win(A).__tapas.pedidas.length };
    afirmar(datos.abrir.me === 1 && datos.abrir.otras === 0, `PUERTA A: abrir «Wrapped» = 1 /me y 0 de lo demás a la simulada (${datos.abrir.me} /me, ${datos.abrir.otras} otras: ${nuevas.map((l) => l.ruta).join(' · ')})`);
    afirmar(datos.abrir.modulo === 0, `PUERTA A: abrir no baja el módulo de la postal (${moduloPostal(A).join(' · ')})`);
    afirmar(datos.abrir.otrosOrigenes === 0, `PUERTA A: nada de otro origen al abrir (${otrosOrigenes.join(' · ')})`);
    afirmar(datos.abrir.tapas === 0, `PUERTA A: 0 tapas pedidas por fetch al abrir (${datos.abrir.tapas})`);
    afirmar(!recursos(A).some((u) => /\/data\/history-stats\.json/.test(u)), 'PUERTA A: el history-stats.json del repo NO se pide (los datos son los sembrados)');
    afirmar(anioActivo(A) === '2025', `PUERTA A: el año elegido de arranque es el último inventado (${anioActivo(A)})`);
    const s = win(A).__sim.reg;
    afirmar(s.desconocidas.length === 0 && s.externas.length === 0 && s.escrituras.length === 0, `PUERTA A: 0 rutas sin simular, 0 hosts externos, 0 escrituras (${s.desconocidas.join(' · ')} ${s.externas.join(' · ')})`);
  }

  // ── B · apretar ────────────────────────────────────────────────────────────
  if (corre('B') || corre('D')) {
    progreso('B: apretar');
    const b = boton(A);
    afirmar(b, 'PUERTA B: la tarjeta del año tiene el botón «Descargar postal (PNG)» dentro de .wrapped-hero');
    afirmar(b.textContent.trim() === 'Descargar postal (PNG)' && b.type === 'button', `PUERTA B: el botón dice «Descargar postal (PNG)» (${b.textContent.trim()})`);
    afirmar(b.previousElementSibling?.matches('.wrapped-hero-sub'), 'PUERTA B: el botón va debajo de .wrapped-hero-sub');
    const g = await generar(A, 'PUERTA B');
    afirmar(g.durante.disabled && g.durante.texto === 'Generando…', `PUERTA B: mientras genera, deshabilitado y «Generando…» (${g.durante.disabled} «${g.durante.texto}»)`);
    afirmar(g.despues === 'Descargar postal (PNG)', `PUERTA B: al terminar vuelve a su texto («${g.despues}»)`);
    afirmar(g.descargas.length === 1, `PUERTA B: UNA descarga (${g.descargas.length})`);
    afirmar(g.desc.nombre === ESPERADO_2025.archivo, `PUERTA B: se llama ${ESPERADO_2025.archivo} («${g.desc.nombre}»)`);
    const png = await leerPng(g.desc.bytes);
    afirmar(png.sig && png.ihdr === 'IHDR' && png.w === 1080 && png.h === 1350 && png.bw === 1080 && png.bh === 1350, `PUERTA B: es un PNG de 1080×1350 (firma ${png.sig}, ${png.ihdr} ${png.w}×${png.h}, decodificado ${png.bw}×${png.bh})`);
    afirmar(g.tapas.length === 0, `PUERTA B: 0 pedidos de tapa (${g.tapas.map((t) => t.url).join(' · ')})`);
    afirmar(g.spotify.length === 0, `PUERTA B: 0 peticiones a Spotify (${g.spotify.map((l) => l.ruta).join(' · ')})`);
    const hosts = [...new Set(g.recursos.map((u) => new URL(u).host))];
    afirmar(hosts.every((h) => h === location.host), `PUERTA B: solo el propio banco (${hosts.join(', ')})`);
    afirmar(g.toasts.length === 1 && g.toasts[0] === 'Postal descargada.', `PUERTA B: el aviso «Postal descargada.» (${g.toasts.join(' | ')})`);
    datos.apretar = { ms: g.ms, spotify: g.spotify.length, tapas: g.tapas.length, hosts: hosts.join(' + ') || 'ninguno', bytes: g.desc.bytes.length, toast: g.toasts.join(' | ') };
    const dib = g.dibujo;
    afirmar(dib && dib.ancho === 1080 && dib.alto === 1350, 'PUERTA B: window.__postalDibujo existe y mide 1080×1350');
    afirmar(!('tapas' in dib), 'PUERTA B: el dibujo no trae tapas');
    const tx = (id) => dib.textos.find((t) => t.id === id)?.texto;
    afirmar(tx('anio') === '2025' && tx('min') === ESPERADO_2025.min && tx('racha') === ESPERADO_2025.racha && tx('pico') === ESPERADO_2025.pico && tx('pico-et') === ESPERADO_2025.picoEt && tx('pie') === ESPERADO_2025.pie,
      `PUERTA B: los textos son los contados a mano (${['anio', 'min', 'racha', 'pico', 'pico-et', 'pie'].map(tx).join(' | ')})`);
    afirmar(!dib.textos.some((t) => /skip|salt|%/i.test(t.texto)), 'PUERTA B: ningún texto de la postal dice «skip», «salt» ni lleva «%»');
    afirmar(!dib.textos.some((t) => /Inventad|Imaginari|Mentira|Ficticio/.test(t.texto)), 'PUERTA B: ningún nombre de artista ni de disco');
    afirmar(dib.celdas.length === 365 && dib.celdas.filter((c) => !c.fuera).length === 273 && dib.celdas.filter((c) => c.pico).length === 1, `PUERTA B: 365 días, 273 con dato (el tramo inventado), 1 pico (${dib.celdas.length}, ${dib.celdas.filter((c) => !c.fuera).length}, ${dib.celdas.filter((c) => c.pico).length})`);
    afirmar(dib.celdas.find((c) => c.pico)?.iso === '2025-03-09', 'PUERTA B: el contorno va en el día pico');
    datos.dibujoB = dib;

    // 2024 arranca el 15/06: lo de antes, «fuera», en los píxeles.
    await elegirAnio(A, 2024);
    const g24 = await generar(A, 'PUERTA B (2024)');
    const png24 = await leerPng(g24.desc.bytes), d24 = g24.dibujo;
    const fuera = mix(token(A, '--color-bg'), token(A, '--color-surface'), 0.48);
    const c0 = d24.celdas.find((c) => c.iso === '2024-01-01'), c1 = d24.celdas.find((c) => c.iso === '2024-06-15');
    const p0 = png24.px(c0.x + c0.w / 2, c0.y + c0.h / 2), p1 = png24.px(c1.x + c1.w / 2, c1.y + c1.h / 2);
    afirmar(g24.desc.nombre === 'fonoteca-2024.png' && d24.celdas.length === 366, `PUERTA B (2024): sale fonoteca-2024.png con 366 días (${g24.desc.nombre}, ${d24.celdas.length})`);
    afirmar(c0.fuera && cerca(p0, hexA(fuera), 2), `PUERTA B (2024): el 1/1, antes del tramo, tiene el tono «fuera» (rgb ${p0} contra ${fuera})`);
    afirmar(!c1.fuera && !cerca(p1, hexA(fuera), 2), `PUERTA B (2024): el 15/06, primer día del tramo, no (rgb ${p1})`);
    afirmar(g24.tapas.length === 0 && g24.spotify.length === 0, 'PUERTA B (2024): 0 tapas y 0 a Spotify');
    datos.fuera = `2024: ${d24.celdas.filter((c) => c.fuera).length} fuera, 1/1 rgb(${p0})`;
    await elegirAnio(A, 2025);

    // ── D · el recorte ─────────────────────────────────────────────────────
    progreso('D: el recorte');
    const pasados = dib.textos.filter((t) => !(t.ancho <= t.max + 0.01));
    afirmar(pasados.length === 0, `PUERTA D: ningún fillText con el ancho medido mayor que su máximo (${pasados.map((t) => `${t.id} ${t.ancho.toFixed(1)}>${t.max}`).join(', ')})`);
    afirmar(dib.textos.length === 21, `PUERTA D: 21 textos (${dib.textos.length})`);
    datos.recorte = { textos: dib.textos.length, holgura: Math.min(...dib.textos.map((t) => t.max - t.ancho)).toFixed(1), letra: dib.letra };
  }

  // ── F · dos clics rápidos ──────────────────────────────────────────────────
  if (corre('F')) {
    progreso('F: dos clics');
    const b = boton(A);
    afirmar(b, 'PUERTA F: hay botón');
    const w = win(A), d0 = w.__descargas.length;
    b.click(); b.click();
    // Y el manejador llamado a mano por segunda vez, como un clic que se colara antes del `disabled`.
    b.onclick?.call(b);
    await esperarReal(() => w.__descargas.length > d0 && w.__descargas.at(-1).bytes && boton(A) && !boton(A).disabled, { que: 'PUERTA F: la descarga', vueltas: VUELTAS });
    await margen(60);
    afirmar(w.__descargas.length - d0 === 1, `PUERTA F: dos clics rápidos = UNA descarga (${w.__descargas.length - d0})`);
    datos.dosClics = w.__descargas.length - d0;
  }

  // ── E · los colores, en los cuatro presets, contra los píxeles ─────────────
  if (corre('E')) {
    progreso('E: colores');
    const res = [];
    for (const id of ['violeta', 'ambar', 'aguamarina', 'papel']) {
      await anclar(win(A).__ponerTema(id));
      const T = token(A, '--color-text'), S = token(A, '--color-text-secondary'), B = token(A, '--color-bg'), U = token(A, '--color-surface'), AC = token(A, '--color-accent');
      const g = await generar(A, `PUERTA E (${id})`);
      const dib = g.dibujo;
      afirmar(dib.colores.bg === B, `PUERTA E (${id}): el fondo de la postal es --color-bg (${dib.colores.bg} contra ${B})`);
      const usados = [...new Set(dib.textos.map((t) => t.valor))];
      afirmar(usados.every((c) => c === T || c === S), `PUERTA E (${id}): el texto usa solo --color-text ${T} y --color-text-secondary ${S} (usados: ${usados.join(', ')})`);
      afirmar(dib.textos.every((t) => (t.color === 'text' ? t.valor === T : t.valor === S)), `PUERTA E (${id}): cada texto lleva el que declara`);
      const png = await leerPng(g.desc.bytes);
      afirmar(cerca(png.px(2, 2), hexA(B), 0) && cerca(png.px(1077, 1347), hexA(B), 0), `PUERTA E (${id}): el fondo, liso (rgb ${png.px(2, 2)})`);
      // Cada caja de texto, en los píxeles: solo tinta sobre el fondo, y el fondo leído ahí ≥ 4,6.
      let min = Infinity, peor = '', raros = 0, leidos = 0;
      for (const t of dib.textos) {
        const r = cajaContraPixeles(png, t, B);
        raros += r.raros; leidos += r.n;
        afirmar(r.raros === 0, `PUERTA E (${id}): en la caja de «${t.id}» hay ${r.raros} píxeles que no son el texto sobre el fondo (algo asoma detrás)`);
        if (r.min < min) { min = r.min; peor = t.id; }
        afirmar(contraste(t.valor, t.sobreValor) >= 4.6, `PUERTA E (${id}): «${t.id}» contra su punto peor según el módulo, ${contraste(t.valor, t.sobreValor).toFixed(2)}`);
      }
      afirmar(min >= 4.6 && leidos > 1000, `PUERTA E (${id}): el contraste peor de los textos contra los píxeles de su fondo es ${min.toFixed(2)}:1 (${peor}, ${leidos} píxeles de fondo) y el piso es 4,6`);
      // Los días: el centro de cada uno es el tono que da la cuenta de acá, y el pico lleva el contorno del texto.
      const tonos = [mix(U, B, 0.3), mix(B, AC, 0.27), mix(B, AC, 0.54), mix(B, AC, 0.84)], fuera = mix(B, U, 0.48);
      const malos = dib.celdas.filter((c) => !cerca(png.px(c.x + c.w / 2, c.y + c.h / 2), hexA(c.fuera ? fuera : tonos[c.nivel]), 2));
      afirmar(malos.length === 0, `PUERTA E (${id}): el centro de cada día es su tono (${malos.length} de ${dib.celdas.length} no: ${malos.slice(0, 3).map((c) => `${c.iso} rgb(${png.px(c.x + c.w / 2, c.y + c.h / 2)})`).join(', ')})`);
      const pico = dib.celdas.find((c) => c.pico), borde = png.px(pico.x + pico.w / 2, pico.y);
      afirmar(cerca(borde, hexA(T), 24), `PUERTA E (${id}): el día pico lleva el contorno de --color-text (rgb ${borde} contra ${T})`);
      res.push(`${id} ${min.toFixed(2)}`);
    }
    await anclar(win(A).__ponerTema('violeta'));
    datos.colores = res.join(' · ');
  }

  // ── J · 0 pedidos a /image/ desde que se aprieta (v=344) ────────────────────
  // 2023 trae las `img` de sus discos con la forma del CDN, servidas por el banco. Antes de apretar se espera a
  // que las `<img>` de la tarjeta terminen, para que una tapa de la tarjeta no cuente como de la postal.
  if (corre('J')) {
    progreso('J: 0 a /image/');
    await elegirAnio(A, 2023);
    await esperarReal(() => [...A.contentDocument.querySelectorAll('#wrapped-year-card img')].every((i) => i.complete), { que: 'PUERTA J: las tapas de la tarjeta', vueltas: VUELTAS });
    await margen(20);
    const r0 = recursos(A).length;
    const g = await generar(A, 'PUERTA J');
    const aImage = [...g.tapas.map((t) => t.url), ...recursos(A).slice(r0)].filter((u) => /\/image\//.test(u));
    afirmar(aImage.length === 0, `PUERTA J: 0 pedidos a /image/ desde que se aprieta (${aImage.join(' · ')})`);
    afirmar(g.tapas.length === 0 && g.spotify.length === 0, `PUERTA J: 0 tapas por fetch y 0 a Spotify (${g.tapas.length}, ${g.spotify.length})`);
    afirmar(g.desc.nombre === 'fonoteca-2023.png', `PUERTA J: la postal de 2023 sale igual (${g.desc.nombre})`);
    datos.cdn = aImage.length;
    await elegirAnio(A, 2025);
  }

  // ── G · salir mientras genera ──────────────────────────────────────────────
  // Lo que la postal espera ahora es la letra (`document.fonts.load`, con su tope de 3 s): se retiene acá.
  if (corre('G')) {
    progreso('G: salir mientras espera la letra');
    const w = win(A), b = boton(A);
    afirmar(b, 'PUERTA G: hay botón');
    const fonts = A.contentDocument.fonts, cargaOriginal = fonts.load;
    let pedidas = 0;
    fonts.load = () => { pedidas++; return new Promise(() => {}); };
    const d0 = w.__descargas.length, t0 = w.__toasts.length;
    let escrituras = 0;
    const obs = new w.MutationObserver((ms) => { escrituras += ms.length; });
    const anclas = new w.MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeName === 'A' && n.download) escrituras++; });
    try {
      b.click();
      await esperarReal(() => pedidas > 0, { que: 'PUERTA G: que la postal espere la letra', vueltas: VUELTAS });
      obs.observe(b, { attributes: true, childList: true, subtree: true, characterData: true });
      anclas.observe(A.contentDocument.body, { childList: true });
      w.location.hash = '#home';
      await esperarReal(() => $(A, '.home-card'), { que: 'PUERTA G: #home', vueltas: VUELTAS });
      // Pasado el tope de la letra (3 s) y algo más: la postal sigue, ve que saliste y no hace nada.
      const t = performance.now();
      await esperarReal(() => performance.now() - t > 5000, { que: 'PUERTA G: el tope de la letra', vueltas: VUELTAS });
      await margen(40);
    } finally {
      fonts.load = cargaOriginal;
      obs.disconnect(); anclas.disconnect();
    }
    afirmar(w.__descargas.length === d0, `PUERTA G: 0 descargas después de salir (${w.__descargas.length - d0})`);
    afirmar(w.__toasts.length === t0, `PUERTA G: 0 avisos después de salir (${w.__toasts.slice(t0).join(' | ')})`);
    afirmar(escrituras === 0, `PUERTA G: 0 escrituras en el DOM (el botón viejo y un <a download>) después del cambio de ruta (${escrituras})`);
    afirmar($(A, '.home-card') && !$(A, '.crash-screen'), 'PUERTA G: #home sigue entera, sin pantalla de error');
    datos.salir = { pedidas, escrituras, descargas: w.__descargas.length - d0 };
  }

  // ── H · sin desborde, a 1366×591 y 390×844 ─────────────────────────────────
  if (corre('H')) {
    progreso('H: sin desborde');
    const res = [];
    for (const [ancho, alto] of [[1366, 591], [390, 844]]) {
      const f = abrirMarco(`H${ancho}`, ancho, alto); marcos.push([`H${ancho}`, f]);
      await arrancado(f, `el marco de ${ancho}`);
      await abrirWrapped(f, `${ancho}×${alto}`);
      const b = boton(f), hero = $(f, '#wrapped-year-card .wrapped-hero');
      afirmar(b, `PUERTA H (${ancho}): hay botón`);
      const rb = b.getBoundingClientRect(), rh = hero.getBoundingClientRect(), de = f.contentDocument.documentElement;
      afirmar(b.scrollWidth <= b.clientWidth, `PUERTA H (${ancho}): el texto del botón no desborda (${b.scrollWidth} > ${b.clientWidth})`);
      afirmar(hero.scrollWidth <= hero.clientWidth, `PUERTA H (${ancho}): .wrapped-hero no desborda (${hero.scrollWidth} > ${hero.clientWidth})`);
      afirmar(rb.left >= rh.left - 0.5 && rb.right <= rh.right + 0.5 && rb.top >= rh.top - 0.5 && rb.bottom <= rh.bottom + 0.5, `PUERTA H (${ancho}): el botón entra en el hero (${rb.left.toFixed(1)}-${rb.right.toFixed(1)} en ${rh.left.toFixed(1)}-${rh.right.toFixed(1)})`);
      afirmar(de.scrollWidth <= win(f).innerWidth, `PUERTA H (${ancho}): sin barra horizontal (${de.scrollWidth} > ${win(f).innerWidth})`);
      res.push(`${ancho}×${alto}: botón ${rb.width.toFixed(0)}×${rb.height.toFixed(0)} en hero ${rh.width.toFixed(0)}, página ${de.scrollWidth}/${win(f).innerWidth}`);
    }
    datos.desborde = res.join(' · ');
  }

  const errores = marcos.flatMap(([n, f]) => win(f).__errores.map((e) => `${n}: ${e}`));
  afirmar(errores.length === 0, `0 errores de consola: ${errores.join(' | ')}`);

  const a = datos.abrir;
  const resumen = `ok · A abrir: /me=${a.me} otras=${a.otras} módulo de la postal=${a.modulo} tapas=${a.tapas}` +
    (datos.apretar ? ` · B apretar (${datos.apretar.ms} ms de reloj): 1 PNG 1080×1350 (${datos.apretar.bytes} B), spotify=${datos.apretar.spotify}, tapas=${datos.apretar.tapas}, hosts=${datos.apretar.hosts}, «${datos.apretar.toast}», ${datos.fuera}` : '') +
    (datos.recorte ? ` · D recorte: ${datos.recorte.textos} textos, holgura mínima ${datos.recorte.holgura} px` : '') +
    (datos.dosClics != null ? ` · F dos clics: ${datos.dosClics} descarga` : '') +
    (datos.colores ? ` · E contraste peor contra los píxeles: ${datos.colores}` : '') +
    (datos.cdn != null ? ` · J pedidos a /image/: ${datos.cdn}` : '') +
    (datos.salir ? ` · G salir: letra pedida ${datos.salir.pedidas} vez/veces, ${datos.salir.descargas} descargas, ${datos.salir.escrituras} escrituras` : '') +
    (datos.desborde ? ` · H ${datos.desborde}` : '') +
    ` · errores=${errores.length} · reloj virtual=${Math.round(performance.now())} ms`;
  document.documentElement.setAttribute('data-resumen', resumen);
  document.getElementById('progreso').textContent = resumen;
  listo(resumen);
} catch (e) {
  fallar(e);
}
</script>
</body></html>
