<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>banco router-teardown — la app entera, en un iframe</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/main.css">
<style>*,*::before,*::after{animation:none!important;transition:none!important}</style>
</head><body>
<div id="app"></div>
<script type="module">
// ── Un iframe del banco `router-teardown.html` (v=324, tanda 71; rehecho en v=345, tanda 99) ──
//
// Arranca la app ENTERA (`/js/app.js`: su `init()`, su barra lateral, su router)
// en una de dos escenas:
//
//   · `?escena=mapa`: `/me` = HISTORY_OWNER_ID contestado por la Spotify simulada
//     (`simulado.mjs`, sin tocar), el historial INVENTADO de `mapa-datos.mjs`
//     (`HISTORIAL`) servido como si fuera el JSON del repo, y el MusicBrainz SIMULADO de
//     la madre (`parent.__mb`, el `crearMB` de `mapa-datos.mjs`). Lo que suma este
//     archivo al doble de MusicBrainz de `mapa-caso.html`: cuenta en `parent.__mbAbortos`
//     cada petición que se aborta MIENTRAS está en vuelo (la señal del `teardown` de
//     `#mapa`, `st.ctrl?.abort()`).
//   · `?escena=disco`: la Spotify simulada y los me gusta y las discografías
//     INVENTADOS de `escenario-ocultos.mjs` (sin tocarlo), para `#discover-artists`,
//     más una W-Three INVENTADA y vacía.
//
// LO QUE SE RETIENE (v=345). `__retenerProxima()` hace que la PRÓXIMA petición de lo que
// solo espera la vista lenta quede sin contestar hasta `__soltar()`; la siguiente pasa:
//   · en `mapa`, el JSON del historial de artistas (`/data/history-artist-tracks.json`):
//     lo pide `loadOne()` DESPUÉS del uid, y no comparte la petición entre rutas (el
//     `memCache` se llena recién al terminar), así que la ruta que llega después pide el
//     suyo y se le contesta;
//   · en `disco`, la `GET /playlists/{W-Three}?fields=snapshot_id` de
//     `buildAlbumHeardIndex()` (`util/album-heard.js`), también DESPUÉS del uid y sin
//     compartir (`getAllPlaylistItems()` no guarda la promesa; el índice se memoiza al
//     terminar).
// Hasta v=344 se retenía la `/me`. Con la promesa en vuelo de `getCurrentUserId()`
// (v=345) todo lo que pide el uid espera el MISMO `/me`: retenerlo trababa también a la
// ruta nueva (`#mapa` no pintaba ni el botón; el `#discover-artists` nuevo no pintaba).
// Por eso la `/me` ya no se retiene: se contesta siempre.
//
// 🔴 Ningún JSON del repo llega al banco: cualquier otro `/data/*` se contesta 404 y se
// anota en `__datosAjenos` (la madre exige que quede vacío).
//
// La madre conduce desde afuera (mismo origen). Nada sale a `api.spotify.com` ni a
// `musicbrainz.org`.

import { instalarRedSimulada, esperarReal } from '/banco/simulado.mjs';

const q = new URLSearchParams(location.search);
const ESCENA = q.get('escena') || 'mapa';
const MARCO = q.get('marco') || ESCENA;
window.__errores = [];
window.__avisos = [];
window.addEventListener('error', (e) => window.__errores.push('error: ' + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => window.__errores.push('rechazo: ' + String(e.reason?.message || e.reason)));
const errorOriginal = console.error.bind(console);
console.error = (...a) => { window.__errores.push('console.error: ' + a.map(String).join(' ').slice(0, 300)); errorOriginal(...a); };
const warnOriginal = console.warn.bind(console);
console.warn = (...a) => { window.__avisos.push(a.map(String).join(' ').slice(0, 300)); warnOriginal(...a); };

// ── La petición que se puede retener ─────────────────────────────────────────
let retener = false;
let soltar = null;
window.__retenida = false;
window.__soltada = false;
window.__retenerProxima = () => { retener = true; };
window.__soltar = () => { if (soltar) soltar(); };
// `valor()` arma la respuesta; si toca retener, la promesa se resuelve recién con `__soltar()`.
const quizasRetenida = (valor) => {
  if (!retener) return valor();
  retener = false;
  window.__retenida = true;
  return new Promise((r) => { soltar = () => { soltar = null; window.__soltada = true; r(valor()); }; });
};

let meId = null;
const responderMe = () => ({ id: meId, display_name: 'Banco' });

if (ESCENA === 'mapa') {
  const { HISTORY_OWNER_ID } = await import('/js/features/history-data.js');
  const { HISTORIAL } = await import('/banco/mapa-datos.mjs');
  meId = HISTORY_OWNER_ID;
  const sim = instalarRedSimulada();
  window.__sim = sim;
  sim.ruta('GET', /^\/me$/, responderMe);
  localStorage.setItem('fonoteca_last_user_id', meId);
  localStorage.setItem('fonoteca_perfil_v1', JSON.stringify({ id: meId, display_name: 'Banco' }));

  window.__datosServidos = 0;
  window.__datosAjenos = [];
  // El MusicBrainz simulado y el JSON del historial, por ENCIMA de la Spotify simulada (como en `mapa-caso.html`).
  const debajo = window.fetch;
  window.fetch = (entrada, opciones = {}) => {
    // ⚠️ `loadOne()` pide el JSON con un objeto `URL`, no con un texto: sin el `href`, `abs` salía `/undefined` y el
    // JSON REAL del repo pasaba al servidor del banco (visto en la tanda 99, en una corrida de prueba).
    const url = typeof entrada === 'string' ? entrada : (entrada instanceof URL ? entrada.href : entrada.url);
    const abs = new URL(url, location.href);
    if (abs.origin === location.origin && /\/data\//.test(abs.pathname)) {
      if (!/\/data\/history-artist-tracks\.json$/.test(abs.pathname)) {
        window.__datosAjenos.push(abs.pathname);
        return Promise.resolve(new Response('{}', { status: 404, headers: { 'content-type': 'application/json' } }));
      }
      return Promise.resolve(quizasRetenida(() => {
        window.__datosServidos++;
        return new Response(JSON.stringify(HISTORIAL), { status: 200, headers: { 'content-type': 'application/json' } });
      }));
    }
    if (abs.hostname !== 'musicbrainz.org') return debajo(entrada, opciones);
    return new Promise((resolver, rechazar) => {
      const signal = opciones.signal;
      const abortar = () => { parent.__mbAbortos = (parent.__mbAbortos || 0) + 1; rechazar(new DOMException('abortado', 'AbortError')); };
      if (signal?.aborted) return abortar();
      signal?.addEventListener('abort', abortar, { once: true });
      // Solo cuenta el aborto de una petición que sigue EN VUELO: si ya contestó, se suelta el oyente.
      const suelta = () => signal?.removeEventListener('abort', abortar);
      parent.__mb.responder(abs.href, { marco: MARCO, metodo: String(opciones.method || 'GET').toUpperCase(), cabeceras: Object.keys(opciones.headers || {}) })
        .then((r) => { suelta(); resolver(new Response(r.cuerpo, { status: r.status, headers: { 'content-type': 'application/json' } })); },
          (e) => { suelta(); rechazar(e); });
    });
  };
} else {
  const { montarEscenarioOcultos } = await import('/banco/escenario-ocultos.mjs');
  const { sim } = await montarEscenarioOcultos();
  meId = 'usuario-banco';
  sim.ruta('GET', /^\/me$/, responderMe);   // la última declarada gana
  // La W-Three INVENTADA y vacía: lo que espera `buildAlbumHeardIndex()` después del uid.
  const { prefKey } = await import('/js/storage.js');
  const WTHREE = 'plWthreeBanco0000000000';
  localStorage.setItem(prefKey('wthree_playlist_id'), WTHREE);
  sim.ruta('GET', new RegExp(`^/playlists/${WTHREE}\\?`), () => quizasRetenida(() => ({ id: WTHREE, name: 'w three (banco)', owner: { id: meId }, snapshot_id: 'w0' })));
  sim.ruta('GET', new RegExp(`^/playlists/${WTHREE}/items`), () => ({ items: [], total: 0, next: null }));
  // Ningún JSON del repo: lo de `/data/` se contesta 404 y se anota (en esta escena no lo pide nadie).
  window.__datosAjenos = [];
  const debajo = window.fetch;
  window.fetch = (entrada, opciones = {}) => {
    const url = typeof entrada === 'string' ? entrada : (entrada instanceof URL ? entrada.href : entrada.url);
    const abs = new URL(url, location.href);
    if (abs.origin === location.origin && /\/data\//.test(abs.pathname)) {
      window.__datosAjenos.push(abs.pathname);
      return Promise.resolve(new Response('{}', { status: 404, headers: { 'content-type': 'application/json' } }));
    }
    return debajo(entrada, opciones);
  };
}

await import('/js/app.js');
await esperarReal(() => document.getElementById('my-history-btn'), { que: 'que la app arranque', vueltas: 4000 });
window.__listo = true;
</script>
</body></html>
