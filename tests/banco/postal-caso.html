<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>banco postal — la app entera, en un iframe</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/main.css">
</head><body>
<div id="app"></div>
<script type="module">
// ── Un iframe del banco `postal.html` (v=326, tanda 73) ───────────────────────
//
// Arranca la app ENTERA (`/js/app.js`) en `#home`, contra la Spotify simulada de `simulado.mjs` (sin
// tocarla), con `/me` = el owner. El `history-stats.json` es INVENTADO (`postal-datos.mjs`) y se siembra
// en IndexedDB antes de arrancar: el JSON horneado del repo no se pide. Lo que le falta a la simulada
// para esta vista se extiende ACÁ, nunca en `src/`:
//
//   · las TAPAS: un `fetch` por encima del de `simulado.mjs` que anota cada pedido de tapa
//     (`window.__tapas.pedidas`, con host y cómo terminó) y lo deja pasar al `fetch` de verdad: las buenas
//     son `data:` URL fabricadas acá, la 404 la contesta el servidor del banco y la «ajena» va a otro
//     origen sin CORS. `window.__tapas.retener = (url) => bool` retiene una hasta `__tapas.soltar()` o
//     hasta que su `signal` aborte (como un `fetch` de verdad);
//   · las DESCARGAS: `HTMLAnchorElement.prototype.click` con `download` no descarga nada (en headless
//     bajaría a ~/Descargas): anota el nombre y lee los bytes del `blob:` (`window.__descargas`);
//   · los TOASTS: un MutationObserver anota el texto de cada `.toast` que entra (`window.__toasts`): con
//     el reloj virtual, uno de 30 s puede irse antes de que la madre lo mire;
//   · `window.__ponerTema(id)`: aplica uno de los cuatro `PRESETS` con `applyTheme` de la app.
//
// Modo `?modo=foto[&tema=papel]` (las capturas y las postales de ejemplo, con un conductor externo y SIN
// reloj virtual): abre `#wrapped` directo y marca `data-foto="listo"` con la tarjeta del año pintada.

import { instalarRedSimulada, esperarReal, anclar } from '/banco/simulado.mjs';
import { tapasInventadas, statsInventadas } from '/banco/postal-datos.mjs';

const q = new URLSearchParams(location.search);
window.__errores = [];
window.addEventListener('error', (e) => window.__errores.push('error: ' + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => window.__errores.push('rechazo: ' + String(e.reason?.message || e.reason)));
const errorOriginal = console.error.bind(console);
console.error = (...a) => { window.__errores.push('console.error: ' + a.map(String).join(' ').slice(0, 300)); errorOriginal(...a); };

const { HISTORY_OWNER_ID } = await import('/js/features/history-data.js');
const sim = instalarRedSimulada();
window.__sim = sim;
sim.ruta('GET', /^\/me$/, () => ({ id: HISTORY_OWNER_ID, display_name: 'Banco' }));
localStorage.setItem('fonoteca_last_user_id', HISTORY_OWNER_ID);
localStorage.setItem('fonoteca_perfil_v1', JSON.stringify({ id: HISTORY_OWNER_ID, display_name: 'Banco' }));
const { prefKey } = await import('/js/storage.js');
// Animaciones en «nunca», como los conductores: la apertura y el hero quedan estáticos.
localStorage.setItem(prefKey('fonoteca_anim_v1'), 'nunca');
if (q.get('tema') && q.get('tema') !== 'violeta') {
  const { PRESETS } = await import('/js/ui/theme-panel.js');
  const p = PRESETS.find((x) => x.id === q.get('tema'));
  if (!p) throw new Error('banco: no encontré el preset ' + q.get('tema'));
  localStorage.setItem(prefKey('fonoteca_theme_v1'), JSON.stringify({ colors: p.colors, preset: p.id }));
}

// ── Las tapas ────────────────────────────────────────────────────────────────
const TAPAS = tapasInventadas();
window.__tapasBuenas = TAPAS;
window.__tapas = { pedidas: [], retener: null, soltar: null };
const fetchSimulado = window.fetch;
const esTapa = (u) => u.startsWith('data:image/') || /\/banco\/(postal-tapa|atardecer-prueba)/.test(u);
window.fetch = (entrada, opciones = {}) => {
  const href = typeof entrada === 'string' ? entrada : entrada.url;
  if (!esTapa(href)) return fetchSimulado(entrada, opciones);
  const abs = new URL(href, location.href);
  const reg = { url: abs.protocol === 'data:' ? `data:#${TAPAS.indexOf(href)}` : abs.href, host: abs.protocol === 'data:' ? 'data:' : abs.host, modo: opciones.mode || null, estado: 'pedida', t0: Math.round(performance.now()), t1: null };
  window.__tapas.pedidas.push(reg);
  const pasar = () => window.__fetchOriginal(entrada, opciones).then((r) => { reg.estado = r.status; reg.t1 = Math.round(performance.now()); return r; }, (e) => { reg.estado = 'rechazada: ' + e.name; reg.t1 = Math.round(performance.now()); throw e; });
  if (window.__tapas.retener?.(href)) {
    reg.estado = 'retenida';
    return new Promise((ok, mal) => {
      const sig = opciones.signal;
      const abortar = () => { reg.estado = 'abortada'; reg.t1 = Math.round(performance.now()); window.__tapas.soltar = null; mal(new DOMException('Aborted', 'AbortError')); };
      if (sig?.aborted) { abortar(); return; }
      sig?.addEventListener('abort', abortar, { once: true });
      window.__tapas.soltar = () => { sig?.removeEventListener('abort', abortar); pasar().then(ok, mal); };
    });
  }
  return pasar();
};

// ── Las descargas y los toasts ───────────────────────────────────────────────
window.__descargas = [];
const clickOriginal = HTMLAnchorElement.prototype.click;
HTMLAnchorElement.prototype.click = function () {
  if (!this.download) return clickOriginal.call(this);
  const d = { nombre: this.download, bytes: null, error: null };
  window.__descargas.push(d);
  window.__fetchOriginal(this.href).then((r) => r.arrayBuffer()).then((b) => { d.bytes = new Uint8Array(b); }, (e) => { d.error = String(e); });
};
window.__toasts = [];
new MutationObserver((ms) => {
  for (const m of ms) for (const n of m.addedNodes) {
    if (n.nodeType === 1 && n.matches?.('.toast')) window.__toasts.push(n.textContent.replace('✕', '').trim());
  }
}).observe(document.body, { childList: true, subtree: true });

window.__ponerTema = async (id) => {
  const { PRESETS, applyTheme } = await import('/js/ui/theme-panel.js');
  const p = PRESETS.find((x) => x.id === id);
  if (!p) throw new Error('banco: no encontré el preset ' + id);
  applyTheme(p.colors);
};

// ── El historial inventado, sembrado antes de arrancar ───────────────────────
{
  const { OWNER_KEYS } = await import('/js/history-keys.js');
  const { idbSetCached } = await import('/js/idb.js');
  await anclar(idbSetCached(OWNER_KEYS.stats, statsInventadas({ tapas: TAPAS, origen: location.origin, puerto: location.port }), 100 * 365 * 24 * 60));
}

const FOTO = q.get('modo') === 'foto';
location.hash = FOTO ? '#wrapped' : '#home';
await import('/js/app.js');
await esperarReal(() => document.getElementById('my-history-btn') && (FOTO || document.querySelector('.home-card')), { que: 'que la app arranque', vueltas: 4000 });
window.__listo = true;
if (FOTO) {
  await esperarReal(() => document.querySelector('#wrapped-year-card .wrapped-hero') && document.querySelector('.wrapped-year-tab.active'), { que: 'que #wrapped pinte', vueltas: 8000 });
  document.documentElement.dataset.foto = 'listo';
}
</script>
</body></html>
