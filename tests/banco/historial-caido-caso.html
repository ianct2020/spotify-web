<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>banco historial caído — la app entera, como el owner</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/main.css">
<style>*,*::before,*::after{animation:none!important;transition:none!important}</style>
</head><body>
<div id="app"></div>
<script type="module">
// ── Caso de las capturas de la tanda 110 (v=353). NO va en `prepush` ──────────
//
// Parte de `letras-caso.html?uid=owner`: arranca la app ENTERA (`/js/app.js`) contra la Spotify
// simulada de `simulado.mjs`, con los me gusta INVENTADOS de `letras-datos.mjs` en la caché y `/me`
// contestando `HISTORY_OWNER_ID`. Lo distinto: NO siembra `OWNER_KEYS.plays` (sí un `detail` vacío,
// `{ tracks: {} }`, para que lo único que falle sea `history-track-plays.json`), así que la app pide los
// JSON del historial a `/data/…`. Quien los contesta es el CONDUCTOR (el de capturas de la tanda 110,
// por CDP): 500 para `history-track-plays`, `history-stats`, `history-listened-albums` y
// `history-artist-tracks`; cualquier otro `/data/` se corta.
//
//   ?vista=ficha     abre la ficha de canción de «Tema de Sesenta Renglones» (inventado)
//   ?vista=artista   abre la ficha de artista de «Banda Inventada» (inventado)
//   ?vista=dashboard entra a `#dashboard`
//   ?vista=covers    entra a `#covers`
//
// Cuando la vista terminó de pintar, `data-foto="listo"` en `<html>`.
//
// ── Tanda 111 (v=354) ─────────────────────────────────────────────────────────
//
//   ?vista=ficha&detalle=1   la misma ficha, pero el tema SÍ está en `detail` (sembrado): con `plays` en 500
//                            es el caso del «0 plays válidas» inventado (T111b)
//   ?vista=album             abre la ficha de álbum de «Disco t111inventada de la ficha» (T111c)
//   ?vista=wthree&caido=stats|ninguno          `#wthree` con la playlist «w three» INVENTADA configurada
//   ?vista=covers-wthree&caido=listened|ninguno `#covers` con esa misma W-Three configurada
//
// En `wthree` y `covers-wthree` los JSON del historial que NO se caen se siembran en la caché del owner
// (`OWNER_KEYS`) con datos INVENTADOS, así que la app no los pide; el que se cae no se siembra y lo pide a
// `/data/…`, donde el conductor contesta 500. Con `caido=ninguno` no se pide ninguno. La playlist tiene 20
// pistas `t111inventada…` de 6 discos inventados; el historial inventado comparte 3 de esos discos y trae 4
// que no están en la playlist. Las tapas son URLs con la forma del CDN que el CONDUCTOR contesta con un PNG
// local (ninguna sale a la red).

import { instalarRedSimulada, esperarReal, anclar } from '/banco/simulado.mjs';
import { likesInventados, TEMAS, pedidoDe, ARTISTA } from '/banco/letras-datos.mjs';

const q = new URLSearchParams(location.search);
const VISTA = q.get('vista') || 'ficha';
window.__errores = [];
window.addEventListener('error', (e) => window.__errores.push('error: ' + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => window.__errores.push('rechazo: ' + String(e.reason?.message || e.reason)));
const errorOriginal = console.error.bind(console);
console.error = (...a) => { window.__errores.push('console.error: ' + a.map(String).join(' ').slice(0, 300)); errorOriginal(...a); };

const { HISTORY_OWNER_ID } = await import('/js/features/history-data.js');
const UID = HISTORY_OWNER_ID;
const sim = instalarRedSimulada();
window.__sim = sim;
sim.ruta('GET', /^\/me$/, () => ({ id: UID, display_name: 'Banco' }));
localStorage.setItem('fonoteca_last_user_id', UID);
localStorage.setItem('fonoteca_perfil_v1', JSON.stringify({ id: UID, display_name: 'Banco' }));

const { idbSetCached } = await import('/js/idb.js');
await anclar(idbSetCached('all_liked_tracks', likesInventados(), null));
const { OWNER_KEYS } = await import('/js/history-keys.js');
const SIEMPRE = 100 * 365 * 24 * 60;
const T111 = VISTA === 'wthree' || VISTA === 'covers-wthree';
const CAIDO = q.get('caido') || 'ninguno';
if (!T111) {
  const detalle = q.get('detalle') === '1'
    ? { tracks: { [TEMAS.largo.id]: { m: { '2023-01': 3, '2023-02': 1, '2023-05': 4, '2024-02': 2 }, f: '2023-01-14', l: '2024-02-03', d: 9, x: 2 } } }
    : { tracks: {} };
  await anclar(idbSetCached(OWNER_KEYS.detail, detalle, SIEMPRE));
}

// ── Lo de la tanda 111: la playlist «w three» y el historial, INVENTADOS ──
const hex24 = (n) => ('a111' + n.toString(16).padStart(20, '0')).slice(0, 24);
const TAPA = (n) => `https://i.scdn.co/image/ab67616d0000b273${hex24(n)}`;
const DISCOS_WT = [1, 2, 3, 4, 5, 6].map((n) => ({ n, id: `t111inventadaalb0000${String(n).padStart(2, '0')}`, name: `Disco t111inventada ${n}`, artist: `Artista t111inventada ${n}`, img: TAPA(n) }));
const POR_DISCO = [4, 4, 3, 3, 3, 3];   // 20 pistas
const PISTAS_WT = [];
DISCOS_WT.forEach((d, i) => { for (let k = 1; k <= POR_DISCO[i]; k++) PISTAS_WT.push({ d, k, id: `t111inventada${String(i * 10 + k).padStart(9, '0')}` }); });
const itemWt = (p) => ({ added_at: '2026-01-01T00:00:00Z', item: { id: p.id, uri: `spotify:track:${p.id}`, type: 'track', name: `Tema t111inventada ${p.d.n}.${p.k}`, duration_ms: 200000, track_number: p.k, artists: [{ id: `t111inventadaart0000${String(p.d.n).padStart(2, '0')}`, name: p.d.artist }], album: { id: p.d.id, name: p.d.name, release_date: '2022-01-01', album_type: 'album', total_tracks: 10, images: [{ url: p.d.img, width: 640, height: 640 }] } } });
// Los del historial que NO están en la playlist (7 a 10).
const DISCOS_HIST = [7, 8, 9, 10].map((n) => ({ n, name: `Disco t111inventada ${n}`, artist: `Artista t111inventada ${n}`, img: TAPA(n) }));
const PLAYLIST_WT = 't111inventadaplwthree0';
if (T111) {
  const { prefKey } = await import('/js/storage.js');
  localStorage.setItem(prefKey('wthree_playlist_id'), PLAYLIST_WT);
  localStorage.setItem(prefKey('wthree_playlist_name'), 'w three t111inventada');
  sim.ruta('GET', new RegExp(`^/playlists/${PLAYLIST_WT}\\?`), () => ({ id: PLAYLIST_WT, name: 'w three t111inventada', owner: { id: UID }, snapshot_id: 't111s1', tracks: { total: PISTAS_WT.length } }));
  sim.ruta('GET', new RegExp(`^/playlists/${PLAYLIST_WT}/items`), () => ({ items: PISTAS_WT.map(itemWt), total: PISTAS_WT.length, limit: 100, offset: 0, next: null }));
  sim.ruta('GET', /^\/me\/playlists/, () => ({ items: [], total: 0, limit: 50, offset: 0, next: null }));
  // Los me gusta: las pistas de la playlist (cada disco de W-Three tiene likes) y una de cada disco del historial.
  const likesT111 = [...PISTAS_WT.map((p) => ({ added_at: '2026-01-02T00:00:00Z', track: itemWt(p).item })),
    ...DISCOS_HIST.map((d) => ({ added_at: '2026-01-03T00:00:00Z', track: { id: `t111inventada${String(900 + d.n).padStart(9, '0')}`, uri: `spotify:track:t111inventada${String(900 + d.n).padStart(9, '0')}`, type: 'track', name: `Tema t111inventada ${d.n}.1`, duration_ms: 200000, track_number: 1, artists: [{ id: `t111inventadaart0000${String(d.n).padStart(2, '0')}`, name: d.artist }], album: { id: `t111inventadaalb0000${String(d.n).padStart(2, '0')}`, name: d.name, release_date: '2021-01-01', album_type: 'album', total_tracks: 10, images: [{ url: d.img, width: 640, height: 640 }] } } }))];
  await anclar(idbSetCached('all_liked_tracks', likesT111, null));
  // El historial INVENTADO: comparte con la playlist los discos 1, 2 y 3; los 7 a 10 son solo del historial.
  const enHist = [...DISCOS_WT.slice(0, 3), ...DISCOS_HIST];
  const stats = { version: 1, years: [{ year: 2024 }], top_albums_all_time: enHist.slice(0, 5).map((d, i) => ({ name: d.name, artist: d.artist, img: d.img, min: 300 - i * 40, plays: 90 - i * 12 })) };
  const listened = { version: 1, criteria: 't111', years: [{ year: 2024, albums: enHist.map((d, i) => ({ name: d.name, artist: d.artist, date: `2024-0${1 + (i % 6)}-1${i % 9}`, tracks_that_day: 5, min_that_day: 25, img: d.img })) }] };
  const plays = { tracks: {}, albums: enHist.map((d, i) => [d.name, d.artist, 90 - i * 10, (300 - i * 30) * 60000, `2024-01-0${1 + i}`]) };
  if (CAIDO !== 'stats') await anclar(idbSetCached(OWNER_KEYS.stats, stats, SIEMPRE));
  if (CAIDO !== 'listened') await anclar(idbSetCached(OWNER_KEYS.listened, listened, SIEMPRE));
  await anclar(idbSetCached(OWNER_KEYS.plays, plays, SIEMPRE));
  await anclar(idbSetCached(OWNER_KEYS.detail, { tracks: {} }, SIEMPRE));
}
// Chart.js no viene (ni sale a la red): el mismo `Chart` de mentira de `letras-caso.html`.
window.Chart = class {
  constructor(canvas, cfg) {
    const caja = canvas.parentElement.getBoundingClientRect();
    canvas.width = Math.round(caja.width); canvas.height = Math.round(caja.height);
    const ctx = canvas.getContext('2d'), datos = cfg.data.datasets[0].data;
    const max = Math.max(1, ...datos), w = canvas.width / Math.max(1, datos.length);
    ctx.fillStyle = cfg.data.datasets[0].backgroundColor;
    datos.forEach((n, i) => { const alto = (canvas.height - 20) * n / max; ctx.fillRect(i * w + 1, canvas.height - 10 - alto, Math.max(1, w - 2), alto); });
  }
  destroy() {}
  resize() {}
  update() {}
};

const RUTA = { dashboard: '#dashboard', covers: '#covers', wthree: '#wthree', 'covers-wthree': '#covers' }[VISTA] || '#home';
location.hash = RUTA;
await import('/js/app.js');
const pausa = (ms) => new Promise((r) => setTimeout(r, ms));
await esperarReal(() => document.getElementById('my-history-btn'), { que: 'que la app arranque', vueltas: 4000 });

if (VISTA === 'ficha') {
  await esperarReal(() => document.querySelector('.home-card'), { que: 'que Home pinte', vueltas: 4000 });
  const tc = await import('/js/features/track-card.js');
  tc.openTrackCard(pedidoDe(TEMAS.largo));
  await esperarReal(() => document.querySelector('#tc-body') && !document.querySelector('#tc-body .skel'), { que: 'que la ficha de canción termine de pintar', vueltas: 4000 });
} else if (VISTA === 'artista') {
  await esperarReal(() => document.querySelector('.home-card'), { que: 'que Home pinte', vueltas: 4000 });
  const ac = await import('/js/features/artist-card.js');
  ac.openArtistCard({ name: ARTISTA });
  await esperarReal(() => document.querySelector('#ac-body') && !document.querySelector('#ac-body .skel'), { que: 'que la ficha de artista termine de pintar', vueltas: 4000 });
} else if (VISTA === 'dashboard') {
  // La pantalla de inicio del Dashboard: «Usar los de la caché» (los me gusta inventados ya sembrados).
  await esperarReal(() => document.getElementById('dash-start-btn'), { que: 'el botón de inicio del Dashboard', vueltas: 8000 });
  document.getElementById('dash-start-btn').click();
  await esperarReal(() => {
    const card = document.getElementById('listened-year-card'), tiles = document.getElementById('listened-year-tiles');
    return card && tiles && (card.style.display === 'none' || !/Cargando/.test(tiles.textContent));
  }, { que: 'que el Dashboard lea el historial', vueltas: 8000 });
} else if (VISTA === 'covers' || VISTA === 'covers-wthree') {
  await esperarReal(() => document.getElementById('covers-content') && !document.querySelector('#covers-content .spinner'), { que: 'que #covers pinte', vueltas: 8000 });
} else if (VISTA === 'wthree') {
  await esperarReal(() => document.getElementById('wthree-content') && !document.querySelector('#wthree-content .spinner'), { que: 'que #wthree pinte', vueltas: 8000 });
} else if (VISTA === 'album') {
  await esperarReal(() => document.querySelector('.home-card'), { que: 'que Home pinte', vueltas: 4000 });
  const al = await import('/js/features/album-card.js');
  al.openAlbumCard({ name: 'Disco t111inventada de la ficha', artist: ARTISTA, img: TAPA(99) });
  await esperarReal(() => document.querySelector('#alb-stats') && !document.querySelector('#alb-likes .skel'), { que: 'que la ficha de álbum termine de pintar', vueltas: 4000 });
}
window.__simReg = sim.reg;
await pausa(1500);
document.documentElement.dataset.foto = 'listo';
</script>
</body></html>
