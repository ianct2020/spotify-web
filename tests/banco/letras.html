<!doctype html><html lang="es"><head><meta charset="utf-8"><title>banco letras — la letra de lrclib en la ficha de canción</title>
<style>html,body{margin:0;background:#111;color:#eee;font:13px system-ui}iframe{border:0;display:block}</style>
</head><body>
<pre id="progreso"></pre>
<div id="marcos"></div>
<script type="module">
// ── Qué prueba este banco (v=311, tanda 59) ──────────────────────────────────
//
// El botón «Letra» de la ficha de canción, en la app ENTERA (`letras-caso.html`,
// uno por iframe), contra la Spotify simulada (`simulado.mjs`) y un lrclib
// SIMULADO que vive acá (`window.__lrc`, de `letras-datos.mjs`). Nada sale a la
// red. Letras, temas y artistas INVENTADOS.
//
//   A. abrir la ficha → 0 peticiones a lrclib, y el botón «Letra» está;
//   B. tocar «Letra» → 1 petición (sin cabeceras propias), la letra a la vista y sin
//      marcas de tiempo; cerrar, volver a abrir y tocar «Letra» → 0 más (la caché);
//      tocarlo otra vez la pliega;
//   C. un 404 → «no tiene la letra», guardado; «Buscar de nuevo» → 1 petición más;
//   D. 503 y 200 → 2 peticiones y la letra; 503 y 503 → 2 peticiones, «no contesta»
//      y NADA guardado (leído de la IndexedDB del perfil del banco);
//   E. un 200 de OTRO artista → no se muestra: se lee «no hay»;
//   F. un me gusta a 3 s de lrclib → el aviso; a 1 s → sin aviso;
//   G. cerrar la ficha con la respuesta en vuelo → 0 errores, 0 escrituras al DOM del
//      modal cerrado, y lo que llegó SÍ queda guardado;
//   H. 0 escrituras a Spotify, 0 rutas sin simular, 0 hosts externos fuera del lrclib
//      simulado, 0 errores;
//   M. el modal con una letra de 60 renglones, a 1366×768 y a 390×844, sin el dueño y
//      (tanda 60) con el dueño: la caja de la letra entera a la vista (C1), la cabecera a
//      390 (C2: botones en ≤ 2 renglones, el artista entero, < 247,5 px) y la de 1366 en
//      78,5 (C3); sin el dueño, el modal entero entra sin scrollear.
//
// ⚠️ Todas las esperas van con `esperarReal` (ver PRESUPUESTO en `scripts/correr-banco.mjs`).

import { esperarReal, anclar } from '/banco/simulado.mjs';
import { fallar, listo } from '/banco/esperar.mjs';
import { crearLrclib, TEMAS } from '/banco/letras-datos.mjs';

const ANCHO = +(new URLSearchParams(location.search).get('ancho') || 1351);
const afirmar = (c, msg) => { if (!c) throw new Error('BANCO: ' + msg); };
const progreso = (t) => { document.getElementById('progreso').textContent = t; };
const VUELTAS = 20000;
const lrc = crearLrclib();
window.__lrc = lrc;

function abrirMarco(nombre, w = ANCHO, h = 800, extra = '') {
  const f = document.createElement('iframe');
  f.width = w; f.height = h;
  f.src = `/banco/letras-caso.html?marco=${nombre}${extra}`;
  document.getElementById('marcos').appendChild(f);
  return f;
}
const win = (f) => f.contentWindow;
const $ = (f, s) => f.contentDocument?.querySelector(s);
const texto = (el) => (el?.textContent || '').replace(/\s+/g, ' ').trim();
const estado = (f) => $(f, '#tc-letra')?.dataset.letraEstado || '';
async function arrancado(f, que) { await esperarReal(() => win(f)?.__listo, { que: `que arranque ${que}`, vueltas: VUELTAS }); }
async function abrirFicha(f, t) {
  win(f).__abrir(t);
  await esperarReal(() => $(f, '#tc-body') && !$(f, '#tc-body .skel'), { que: `que la ficha de «${t.name}» termine de pintar`, vueltas: 4000 });
}
function cerrarFicha(f) {
  const x = $(f, '.modal [data-close-modal]');
  afirmar(x, 'hay una ✕ para cerrar la ficha');
  x.click();
  afirmar(!$(f, '#tc-letra-btn'), 'la ficha se cerró');
}
const FINAL = /^(letra|instrumental|no-hay|fallo|error)$/;
async function tocarLetra(f, esperado, que) {
  $(f, '#tc-letra-btn').click();
  await esperarReal(() => FINAL.test(estado(f)), { que: `${que} (estado «${estado(f)}»)`, vueltas: 4000 });
  afirmar(esperado.test(estado(f)), `${que}: el bloque quedó en «${estado(f)}», se esperaba ${esperado}`);
}
// La clave del encargo, escrita acá a propósito: el banco tiene que poder correr (y dar rojo)
// contra un `src/` que todavía no tiene `util/letras.js`.
const guardado = (f, t) => anclar(win(f).__idb.idbGet(`letras_v1_${t.id}`));
const notas = [];

try {
  const a = abrirMarco('fichas');
  await arrancado(a, 'el marco de las fichas');

  // ── A. Abrir no pide ────────────────────────────────────────────────────────
  progreso('A. abrir…');
  await abrirFicha(a, TEMAS.faro);
  // Un rato de reloj con la ficha abierta, por si algo pidiera «de fondo».
  for (let i = 0; i < 20; i++) await new Promise((r) => setTimeout(r, 50));
  afirmar(lrc.reg.length === 0, `A. abrir la ficha: 0 peticiones a lrclib (hubo ${lrc.reg.length}: ${lrc.reg.map((r) => r.url).join(' · ')})`);
  const btn = $(a, '#tc-letra-btn');
  afirmar(btn && texto(btn) === 'Letra', `A. el botón «Letra» está (${texto(btn)})`);
  afirmar(btn.closest('div') === $(a, '#tc-preview')?.closest('div'), 'A. en la fila de «▶ Preview» y «Abrir en Spotify»');
  afirmar(btn.getAttribute('aria-expanded') === 'false', 'A. plegado al abrir (aria-expanded=false)');
  afirmar($(a, '#tc-letra')?.hidden === true, 'A. el bloque de la letra, oculto al abrir');

  // ── B. Tocar pide UNA vez; la segunda apertura sale de la caché ─────────────
  progreso('B. tocar «Letra»…');
  await tocarLetra(a, /^letra$/, 'B1. la letra a la vista');
  afirmar(lrc.pedidasDe(TEMAS.faro) === 1 && lrc.reg.length === 1, `B1. 1 petición (${lrc.reg.length})`);
  const p = lrc.reg[0];
  const u = new URL(p.url);
  afirmar(u.origin + u.pathname === 'https://lrclib.net/api/get', `B1. a /api/get (${p.url})`);
  afirmar([...u.searchParams.keys()].join(',') === 'artist_name,track_name', `B1. solo artist_name y track_name (${[...u.searchParams.keys()]})`);
  afirmar(u.searchParams.get('artist_name') === 'Banda Inventada' && u.searchParams.get('track_name') === TEMAS.faro.name, 'B1. el artista principal y el nombre tal cual');
  afirmar(p.metodo === 'GET' && p.cabeceras.length === 0 && !p.credenciales, `B1. GET sin cabeceras propias ni credenciales (${p.metodo} · ${p.cabeceras} · ${p.credenciales})`);
  const tx = $(a, '.tc-letra-texto');
  afirmar(tx && /Renglón inventado número 1 de la canción/.test(tx.textContent), 'B1. la letra inventada a la vista');
  afirmar(!/\[\d\d:\d\d/.test(tx.textContent), 'B1. sin marcas de tiempo');
  afirmar(tx.textContent.split('\n').length >= 7, `B1. con sus saltos de línea (${tx.textContent.split('\n').length} renglones)`);
  afirmar(texto($(a, '.tc-letra-fuente')) === 'Letra de lrclib.net', 'B1. «Letra de lrclib.net» debajo');
  afirmar($(a, '#tc-letra-btn').getAttribute('aria-expanded') === 'true' && !$(a, '#tc-letra').hidden, 'B1. el bloque abierto (aria-expanded=true)');
  $(a, '#tc-letra-btn').click();
  afirmar($(a, '#tc-letra').hidden && $(a, '#tc-letra-btn').getAttribute('aria-expanded') === 'false', 'B2. tocarlo otra vez la pliega');
  $(a, '#tc-letra-btn').click();
  afirmar(!$(a, '#tc-letra').hidden && estado(a) === 'letra' && lrc.reg.length === 1, `B2. y desplegarla no pide nada (${lrc.reg.length})`);
  const regFaro = await guardado(a, TEMAS.faro);
  afirmar(regFaro?.value?.texto && regFaro.value.id && regFaro.value.fecha, `B3. guardada en letras_v1_<id> (${JSON.stringify(regFaro?.value)?.slice(0, 80)})`);
  afirmar(!('syncedLyrics' in regFaro.value) && !('plainLyrics' in regFaro.value), 'B3. recortada: sin las letras crudas');
  cerrarFicha(a);
  await abrirFicha(a, TEMAS.faro);
  afirmar($(a, '#tc-letra').hidden === true, 'B4. al volver a abrir, plegada otra vez');
  await tocarLetra(a, /^letra$/, 'B4. la segunda apertura, de la caché');
  afirmar(lrc.reg.length === 1, `B4. 0 peticiones más (${lrc.reg.length})`);
  // ── F (primera mitad). El aviso: la tuya dura 3:23 y la de lrclib 3:20 ──────
  const aviso = texto($(a, '.tc-letra-aviso'));
  afirmar(aviso === 'Puede ser de otra versión: esta dura 3:20 y la tuya 3:23.', `F1. el aviso con 3 s de diferencia («${aviso}»)`);
  cerrarFicha(a);
  await abrirFicha(a, TEMAS.cercano);
  await tocarLetra(a, /^letra$/, 'F2. la letra del tema a 1 s');
  afirmar(!$(a, '.tc-letra-aviso'), `F2. a 1 s, sin aviso («${texto($(a, '.tc-letra-aviso'))}»)`);
  cerrarFicha(a);
  notas.push(`B: 1 petición y 0 en la segunda apertura · F: «${aviso}» / sin aviso a 1 s`);

  // ── C. El 404 ──────────────────────────────────────────────────────────────
  progreso('C. 404…');
  const antesC = lrc.reg.length;
  await abrirFicha(a, TEMAS.silencio);
  await tocarLetra(a, /^no-hay$/, 'C1. el 404');
  afirmar(lrc.reg.length === antesC + 1, `C1. 1 petición (${lrc.reg.length - antesC})`);
  afirmar(texto($(a, '#tc-letra .tc-letra-estado')) === 'lrclib no tiene la letra de este tema.', `C1. el mensaje («${texto($(a, '#tc-letra .tc-letra-estado'))}»)`);
  const reg404 = await guardado(a, TEMAS.silencio);
  afirmar(reg404?.value?.noHay === true && reg404.value.fecha, `C1. guardado como «no hay», con la fecha (${JSON.stringify(reg404?.value)})`);
  const buscar = $(a, '#tc-letra [data-letra-accion="buscar"]');
  afirmar(texto(buscar) === 'Buscar de nuevo', `C2. ofrece «Buscar de nuevo» (${texto(buscar)})`);
  buscar.click();
  await esperarReal(() => estado(a) === 'letra', { que: `C2. «Buscar de nuevo» trae la letra (estado «${estado(a)}»)`, vueltas: 4000 });
  afirmar(lrc.reg.length === antesC + 2, `C2. 1 petición más (${lrc.reg.length - antesC})`);
  const regPisado = await guardado(a, TEMAS.silencio);
  afirmar(regPisado?.value?.texto && !regPisado.value.noHay, 'C2. y pisó lo guardado');
  cerrarFicha(a);

  // ── D. El 503 ──────────────────────────────────────────────────────────────
  progreso('D. 503…');
  const antesD = lrc.reg.length;
  await abrirFicha(a, TEMAS.ocupado);
  await tocarLetra(a, /^letra$/, 'D1. 503 y después 200: la letra');
  afirmar(lrc.pedidasDe(TEMAS.ocupado) === 2, `D1. 2 peticiones (${lrc.pedidasDe(TEMAS.ocupado)})`);
  cerrarFicha(a);
  await abrirFicha(a, TEMAS.caido);
  await tocarLetra(a, /^fallo$/, 'D2. 503 dos veces: el fallo');
  afirmar(lrc.pedidasDe(TEMAS.caido) === 2, `D2. 2 peticiones, no más (${lrc.pedidasDe(TEMAS.caido)})`);
  afirmar(texto($(a, '#tc-letra .tc-letra-estado')) === 'lrclib no contesta ahora. Prueba otra vez en un rato.', `D2. «no contesta» («${texto($(a, '#tc-letra .tc-letra-estado'))}»)`);
  afirmar(texto($(a, '#tc-letra [data-letra-accion="reintentar"]')) === 'Reintentar', 'D2. con «Reintentar»');
  const regCaido = await guardado(a, TEMAS.caido);
  afirmar(regCaido === undefined || regCaido === null, `D2. NADA guardado en la IndexedDB del banco (${JSON.stringify(regCaido)})`);
  $(a, '#tc-letra [data-letra-accion="reintentar"]').click();
  await esperarReal(() => estado(a) === 'letra', { que: `D3. «Reintentar» pide otra vez (estado «${estado(a)}»)`, vueltas: 4000 });
  afirmar(lrc.pedidasDe(TEMAS.caido) === 3, `D3. 1 petición más (${lrc.pedidasDe(TEMAS.caido)})`);
  cerrarFicha(a);
  notas.push(`D: 503+200 → ${lrc.pedidasDe(TEMAS.ocupado)} peticiones · 503+503 → 2 y nada guardado`);

  // ── E. Otro artista ────────────────────────────────────────────────────────
  progreso('E. otro artista…');
  await abrirFicha(a, TEMAS.ajeno);
  await tocarLetra(a, /^no-hay$/, 'E. un 200 de otro artista se lee «no hay»');
  afirmar(!$(a, '.tc-letra-texto'), 'E. la letra de otro NO se muestra');
  afirmar(texto($(a, '#tc-letra .tc-letra-estado')) === 'lrclib no tiene la letra de este tema.', 'E. con el mensaje de «no hay»');
  cerrarFicha(a);

  // ── G. Cerrar con la respuesta en vuelo ────────────────────────────────────
  progreso('G. en vuelo…');
  await abrirFicha(a, TEMAS.lento);
  $(a, '#tc-letra-btn').click();
  await esperarReal(() => lrc.colgadas.length === 1, { que: 'G. la petición, colgada', vueltas: 4000 });
  const overlay = $(a, '#tc-letra').closest('.modal-overlay');
  afirmar(overlay, 'G. el bloque vive dentro del overlay del modal');
  let mutaciones = 0;
  const mo = new (win(a).MutationObserver)((l) => { mutaciones += l.length; });
  cerrarFicha(a);
  afirmar(!overlay.isConnected, 'G. el modal se cerró');
  mo.observe(overlay, { subtree: true, childList: true, attributes: true, characterData: true });
  const erroresAntes = win(a).__errores.length;
  lrc.soltar();
  let regLento = null;
  for (let i = 0; i < 400 && !regLento?.value; i++) {
    regLento = await guardado(a, TEMAS.lento);
    if (!regLento?.value) await new Promise((r) => setTimeout(r, 20));
  }
  for (let i = 0; i < 10; i++) await new Promise((r) => setTimeout(r, 20));
  mo.disconnect();
  afirmar(mutaciones === 0, `G. 0 escrituras al DOM del modal cerrado (${mutaciones})`);
  afirmar(win(a).__errores.length === erroresAntes, `G. 0 errores (${win(a).__errores.slice(erroresAntes).join(' · ')})`);
  afirmar(regLento?.value?.texto, 'G. el éxito que llegó tarde SÍ se guardó');

  // ── H. Sin fugas ───────────────────────────────────────────────────────────
  const s = win(a).__sim.reg;
  afirmar(s.escrituras.length === 0, `H. 0 escrituras en la cuenta: ${s.escrituras.map((x) => x.metodo + ' ' + x.ruta).join(' · ')}`);
  afirmar(s.desconocidas.length === 0, `H. ninguna ruta sin simular: ${s.desconocidas.join(' · ')}`);
  afirmar(s.externas.length === 0, `H. ningún host externo fuera del lrclib simulado: ${s.externas.join(' · ')}`);
  afirmar(win(a).__errores.length === 0, `H. 0 errores: ${win(a).__errores.join(' · ')}`);
  afirmar(lrc.reg.every((r) => r.cabeceras.length === 0 && r.metodo === 'GET'), 'H. todas las peticiones a lrclib, GET sin cabeceras');
  const spotify = s.llamadas.filter((l) => !/^https:\/\/lrclib/.test(l.ruta)).map((l) => l.metodo + ' ' + l.ruta);
  afirmar(spotify.every((x) => x === 'GET /me'), `H. a Spotify, solo el /me (${spotify.join(' · ')})`);

  // ── M. El modal, con 60 renglones (tanda 59) y con el DUEÑO (tanda 60) ───
  // Cuatro marcos, uno por caso, cada uno con su viewport fijo desde que nace: quien no es el
  // dueño (el cuerpo es un párrafo) y el dueño (`?uid=owner`: números, fechas y la curva de
  // 200 px, con el historial INVENTADO de `historialDuenio()`), a 1366×768 y a 390×844. Los del
  // dueño van después: su marco escribe `fonoteca_last_user_id` y siembra las claves del dueño.
  //   C1. con la letra abierta y el scroll del modal en 0, la caja de la letra entera (del aviso
  //       a «Letra de lrclib.net») queda DENTRO del área visible del modal, en los cuatro;
  //   C2. a 390: la fila de botones en 2 renglones como mucho, el artista sin cortar
  //       (`scrollWidth <= clientWidth`, «Banda Inventada») y la cabecera por debajo de 247,5 px;
  //   C3. a 1366: la cabecera en 78,5 px (dueño o no);
  //   y, sin el dueño, el modal entero entra sin scrollear y la letra scrollea dentro (la 59).
  // Que el modal del DUEÑO scrollee con la letra abierta se acepta: se mide y no se afirma.
  progreso('M. el modal…');
  const medidas = [];
  const fallosM = [];
  const r1 = (n) => Math.round(n * 10) / 10;
  function medirModal(f) {
    const modal = $(f, '.modal');
    modal.scrollTop = 0;
    const cab = modal.firstElementChild;
    const fila = $(f, '#tc-preview').parentElement;
    const renglones = new Set([...fila.children].map((b) => Math.round(b.getBoundingClientRect().top))).size;
    const art = $(f, '.tc-artists');
    const rm = modal.getBoundingClientRect();
    const out = {
      alto: r1(rm.height), tope: win(f).getComputedStyle(modal).maxHeight,
      scrollea: modal.scrollHeight > modal.clientHeight + 1, sh: modal.scrollHeight, ch: modal.clientHeight,
      cab: r1(cab.getBoundingClientRect().height), renglones,
      artCortado: art.scrollWidth > art.clientWidth, artW: `${art.scrollWidth}/${art.clientWidth}`,
    };
    const aviso = $(f, '#tc-letra .tc-letra-aviso');
    const fuente = $(f, '#tc-letra .tc-letra-fuente');
    if (aviso && fuente && !$(f, '#tc-letra').hidden) {
      const arriba = rm.top + modal.clientTop;
      out.cajaTop = r1(aviso.getBoundingClientRect().top - arriba);
      out.cajaBottom = r1(fuente.getBoundingClientRect().bottom - arriba);
      out.visible = modal.clientHeight;
      out.cajaDentro = out.cajaTop >= 0 && out.cajaBottom <= out.visible + 0.5;
      const bloque = $(f, '.tc-letra-texto');
      out.bloque = `${bloque.clientHeight}/${bloque.scrollHeight}`;
      out.bloqueScrollea = bloque.scrollHeight > bloque.clientHeight;
    }
    return out;
  }
  const fmt = (m) => `alto ${m.alto} (tope ${m.tope}) ${m.scrollea ? 'SCROLLEA' : 'entra'} ${m.sh}/${m.ch} · cabecera ${m.cab} · botones en ${m.renglones} renglón(es) · artista ${m.artCortado ? 'CORTADO' : 'entero'} ${m.artW}` +
    (m.cajaTop !== undefined ? ` · caja ${m.cajaTop}→${m.cajaBottom} de ${m.visible} ${m.cajaDentro ? 'dentro' : 'FUERA'} · bloque ${m.bloque}` : '');
  for (const [duenio, w, h] of [[false, 1366, 768], [false, 390, 844], [true, 1366, 768], [true, 390, 844]]) {
    const caso = `${duenio ? 'dueño' : 'no dueño'} ${w}×${h}`;
    const f = abrirMarco(`medir-${duenio ? 'duenio-' : ''}${w}`, w, h, duenio ? '&uid=owner' : '');
    await arrancado(f, `el marco de ${caso}`);
    await abrirFicha(f, TEMAS.largo);
    if (duenio) await esperarReal(() => $(f, '#tc-chart') && $(f, '.tc-stats'), { que: `que la ficha del dueño pinte su cuerpo (${caso})`, vueltas: 4000 });
    else afirmar(!$(f, '.tc-stats'), `M. ${caso}: sin el cuerpo del dueño`);
    const cerrado = medirModal(f);
    await tocarLetra(f, /^letra$/, `M. la letra de 60 renglones (${caso})`);
    const abierto = medirModal(f);
    medidas.push(`${caso}: cerrada [${fmt(cerrado)}] · abierta [${fmt(abierto)}]`);
    if (!abierto.cajaDentro) fallosM.push(`C1 ${caso}: la caja de la letra ${abierto.cajaTop}→${abierto.cajaBottom}, el área visible ${abierto.visible}`);
    if (w === 390) {
      if (abierto.renglones > 2) fallosM.push(`C2 ${caso}: los botones en ${abierto.renglones} renglones`);
      if (abierto.artCortado) fallosM.push(`C2 ${caso}: el artista cortado (${abierto.artW})`);
      if (!(abierto.cab < 247.5)) fallosM.push(`C2 ${caso}: la cabecera en ${abierto.cab} (tiene que bajar de 247,5)`);
    } else if (abierto.cab !== 78.5) fallosM.push(`C3 ${caso}: la cabecera en ${abierto.cab}, no 78,5`);
    if (!duenio && (abierto.scrollea || !abierto.bloqueScrollea)) fallosM.push(`${caso}: el modal tiene que entrar sin scrollear y la letra scrollear dentro`);
    if (win(f).__errores.length) fallosM.push(`${caso}: errores ${win(f).__errores.join(' · ')}`);
    if (duenio) {
      const sd = win(f).__sim.reg;
      if (sd.externas.length || sd.desconocidas.length || sd.escrituras.length) fallosM.push(`${caso}: fugas ${JSON.stringify({ e: sd.externas, d: sd.desconocidas, w: sd.escrituras.length })}`);
    }
  }
  afirmar(fallosM.length === 0, `M. ${fallosM.join(' · ')} — medido: ${medidas.join(' | ')}`);
  notas.push('M: ' + medidas.join(' | '));

  const resumen = `ok · A: abrir=0 lrclib · ${notas.join(' · ')} · G: 0 escrituras al DOM cerrado, guardado · peticiones lrclib=${lrc.reg.length} · escrituras=0 · externos=0 · errores=0 · ` +
    `reloj virtual=${Math.round(performance.now())} ms`;
  document.documentElement.setAttribute('data-resumen', resumen);
  progreso(resumen);
  listo(resumen);
} catch (e) { fallar(e); }
</script></body></html>
