<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>banco guard-ruta-vieja — la app entera, en un iframe</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/main.css">
<style>*,*::before,*::after{animation:none!important;transition:none!important}</style>
<script type="importmap">
{
  "imports": {
    "/js/features/records.js": "/banco/guard-ruta-vieja-espia.mjs?m=records",
    "/js/features/by-artist.js": "/banco/guard-ruta-vieja-espia.mjs?m=by-artist",
    "/js/idb.js": "/banco/guard-ruta-vieja-idb.mjs"
  },
  "scopes": {
    "/banco/": {
      "/js/features/records.js": "/js/features/records.js",
      "/js/features/by-artist.js": "/js/features/by-artist.js",
      "/js/idb.js": "/js/idb.js"
    }
  }
}
</script>
</head><body>
<div id="app"></div>
<script type="module">
// ── Un iframe del banco `guard-ruta-vieja.html` (v=325, tanda 72) ────────────
//
// Arranca la app ENTERA (`/js/app.js`: su `init()`, su barra lateral, su router) con la
// Spotify simulada (`simulado.mjs`, sin tocarlo). El usuario es INVENTADO
// (`usuario-banco`, no es el owner): `#records` no llega a pedir ningún JSON del
// historial, porque `loadOne()` le devuelve `null` sin datos BYOH. Nada sale a
// `api.spotify.com`.
//
// Lo que suma este archivo a la Spotify simulada: la `/me` que se puede RETENER y soltar
// con error. `__retenerProximaMe()` hace que la próxima `GET /me` quede sin contestar
// hasta `__soltarMe(modo)`:
//   · `modo = 'falla'`: se contesta 500, y desde ahí TODAS las `/me` contestan 500 (los
//     reintentos de `spotifyFetch` también: 5 con backoff, y después tira);
//   · `modo = 'ok'`: se contesta bien.
// El `/me` del arranque (`testConnection()`) sale antes, no se retiene y no pasa por el
// memo de `getCurrentUserId()`: la primera vista que pregunta quién sos paga la suya.
//
// v=329 (tanda 75), dos cosas más:
//   · el import map de arriba desvía `/js/features/records.js` y `/js/features/by-artist.js` a
//     `guard-ruta-vieja-espia.mjs`, que importa el módulo REAL y anota en `window.__renders` cuándo
//     terminó su `render` y si tiró (re-tirando el mismo error). Es con lo que el banco sabe que la
//     ruta vieja terminó cuando ya no tira;
//   · `?likes=N` siembra, ANTES de arrancar la app, N me gusta INVENTADOS en la caché de IndexedDB
//     (`all_liked_tracks`, la clave de `leerLikesCacheados()`), para que la lectura de `#byartist`
//     (`getBestAvailableLikes()`, solo IndexedDB) tarde lo bastante para salir mientras lee.
// v=345 (tanda 100): «que tarde lo bastante» era una apuesta y a veces se perdía (el render terminaba antes
// de que la madre viera el spinner: «ausente»). El import map desvía también `/js/idb.js` a
// `guard-ruta-vieja-idb.mjs`, que re-exporta el real y deja RETENER la próxima lectura de los me gusta
// (`__retenerProximaLecturaLikes()` / `__soltarLecturaLikes()`), como la `/me` de arriba. La siembra de
// abajo importa `idb.js` desde `/banco/`, o sea el real. Los 60.000 siguen: los lee D al soltarla y los
// pinta E.

import { instalarRedSimulada, esperarReal, anclar } from '/banco/simulado.mjs';

window.__errores = [];
window.__avisos = [];
window.addEventListener('error', (e) => window.__errores.push('error: ' + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => window.__errores.push('rechazo: ' + String(e.reason?.message || e.reason)));
const errorOriginal = console.error.bind(console);
console.error = (...a) => { window.__errores.push('console.error: ' + a.map(String).join(' ').slice(0, 300)); errorOriginal(...a); };
const warnOriginal = console.warn.bind(console);
console.warn = (...a) => { window.__avisos.push(a.map(String).join(' ').slice(0, 300)); warnOriginal(...a); };

const ME_ID = 'usuario-banco';
let retener = false;
let soltar = null;
let falla = false;
window.__meRetenida = false;
window.__meSoltada = false;
window.__mePedidas = 0;
window.__retenerProximaMe = () => { retener = true; };
window.__soltarMe = (modo) => { if (soltar) soltar(modo); };
const bien = () => ({ id: ME_ID, display_name: 'Banco' });
const mal = () => ({ __status: 500, body: { error: { status: 500, message: 'banco: /me caída' } } });
const responderMe = () => {
  window.__mePedidas++;
  if (falla) return mal();
  if (!retener) return bien();
  retener = false;
  window.__meRetenida = true;
  return new Promise((r) => {
    soltar = (modo) => {
      soltar = null;
      window.__meSoltada = true;
      if (modo === 'falla') { falla = true; r(mal()); } else r(bien());
    };
  });
};

const sim = instalarRedSimulada();
window.__sim = sim;
sim.ruta('GET', /^\/me$/, responderMe);
localStorage.setItem('fonoteca_last_user_id', ME_ID);
localStorage.setItem('fonoteca_perfil_v1', JSON.stringify(bien()));

const LIKES = +(new URLSearchParams(location.search).get('likes') || 0);
if (LIKES > 0) {
  const { idbSetCached } = await import('/js/idb.js');
  const items = Array.from({ length: LIKES }, (_, i) => ({
    added_at: '2020-01-01T00:00:00Z',
    track: {
      uri: `spotify:track:banco${i}`, id: `banco${i}`, name: `Tema inventado ${i}`, duration_ms: 200000,
      artists: [{ id: `artista${i % 500}`, name: `Artista inventado ${i % 500}` }],
      album: { id: `disco${i % 2000}`, name: `Disco inventado ${i % 2000}`, images: [] },
    },
  }));
  await anclar(idbSetCached('all_liked_tracks', items, null));
  window.__likesSembrados = LIKES;
}

await import('/js/app.js');
await esperarReal(() => document.getElementById('my-history-btn'), { que: 'que la app arranque', vueltas: 4000 });
window.__listo = true;
</script>
</body></html>
