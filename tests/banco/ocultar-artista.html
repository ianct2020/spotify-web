<!doctype html><html lang="es"><head><meta charset="utf-8"><title>banco ocultar artista — las tres vistas</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/main.css">
<style>html,body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans),system-ui}</style>
</head><body class="sidebar-hidden">
<div id="caja"><main class="main" id="main-content"></main></div>
<script type="module">
// ── Qué prueba este banco (v=276) ────────────────────────────────────────────
//
// Las TRES vistas reales —`#follow-artists`, `#discover-artists` y `#similar`—
// ocultando y volviendo a mostrar un artista, contra una Spotify simulada
// (`simulado.mjs`): **0 peticiones reales y 0 escrituras reales**. No es un
// detalle de prolijidad: ocultar ESCRIBE en una playlist de la cuenta de Ian, y
// el encargo del 06/10 daba 0 escrituras. Contra producción esta prueba no se
// puede hacer; acá sí, y completa.
//
// Lo que se afirma, vista por vista:
//   · el contador ANTES y DESPUÉS de ocultar, y al volver a mostrar;
//   · que el artista desaparece de la lista y reaparece;
//   · que sigue oculto con el módulo recargado de cero (ver «la recarga»);
//   · que la pista representativa llegó a la playlist espejo simulada.
//
// Y lo que solo se puede ver acá, no en un test estático:
//   · que las tres mueven EL MISMO almacén — ocultar en una se ve en las otras;
//   · cuántas FILAS ocupa la barra de `#discover-artists` con el control nuevo.
//     ⚠️ Esto último es el freno que el encargo nombraba: el 03/10 se midió que
//     un botón más en `.disco-controls` mueve el punto de rotura de 1.214 a
//     1.348 px, y a 1.366 quedan 18 px. Acá sale el número de verdad.
//
// LA RECARGA. Un banco es UNA carga de página, así que «sigue oculto tras
// recargar» no se puede probar con un F5 de verdad. Lo que se prueba es lo que
// una recarga realmente vuelve a leer: (a) lo que quedó escrito en
// localStorage, y (b) una instancia NUEVA del módulo del almacén
// (`import` con query distinta), cuyo caché de claves nace vacío y se llena
// leyendo el disco igual que en una sesión de página nueva. Si eso ve el oculto,
// una recarga también. Se dice así de explícito para que nadie lea de acá una
// garantía que el banco no da.
//
// `?paso=oculto` deja `#discover-artists` con un artista oculto, para fotografiar.
// `?vista=similar|disco|follow` deja esa vista pintada y se detiene ahí.
// `?ancho=1366` cambia el ancho de la caja (por defecto 1351, como los otros bancos).

import { hojasLegibles, fallar, listo } from '/banco/esperar.mjs';
import { instalarRedSimulada, crearLikes, ARTISTAS, esperarReal, anclar } from '/banco/simulado.mjs';
const esperarA = (cond, { que }) => esperarReal(cond, { que });

window.__cons = [];
const consola = console.warn.bind(console);
console.warn = (...a) => { window.__cons.push(a.join(' ')); consola(...a); };
window.addEventListener('unhandledrejection', e => window.__cons.push('rechazo: ' + (e.reason?.message || e.reason)));

const q = new URLSearchParams(location.search);
const PASO = q.get('paso');
const VISTA = q.get('vista');
if (PASO || VISTA) document.head.insertAdjacentHTML('beforeend', '<style>*,*::before,*::after{animation:none!important;transition:none!important}</style>');
const ANCHO = +(q.get('ancho') || 1351);
const afirmar = (c, msg) => { if (!c) throw new Error('BANCO: ' + msg); };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const main = () => $('#main-content');
const limpiarVista = (suelta) => { if (typeof suelta === 'function') suelta(); main().innerHTML = ''; };
const medidas = [];

// Cuántas FILAS ocupa una barra: mismo criterio que barra.html y novedades.html
// (los centros verticales de los hijos visibles, agrupados con 8 px de holgura).
function filasDe(sel) {
  const hijos = $$(`${sel} > *`).filter(e => getComputedStyle(e).display !== 'none' && e.getBoundingClientRect().height);
  const centros = hijos.map(e => { const r = e.getBoundingClientRect(); return r.top + r.height / 2; }).sort((a, b) => a - b);
  const filas = centros.reduce((n, c, i) => (i === 0 || c - centros[i - 1] > 8) ? n + 1 : n, 0);
  const barra = $(sel).getBoundingClientRect();
  const ultimo = hijos.at(-1)?.getBoundingClientRect();
  return { filas, libres: ultimo ? Math.round(barra.right - ultimo.right) : null,
    detalle: hijos.map(e => { const r = e.getBoundingClientRect(); return `${(e.id || e.textContent || '?').trim().slice(0, 14)}@${Math.round(r.left)},${Math.round(r.top)} w${Math.round(r.width)}`; }).join(' | ') };
}

try {
  await hojasLegibles(['/css/main.css', '/css/components.css']);
  $('#caja').style.width = ANCHO + 'px';
  const sim = instalarRedSimulada();
  window.__sim = sim;
  const likes = crearLikes();

  // ── La Spotify de mentira ───────────────────────────────────────────────────
  // La playlist de ocultos tiene ESTADO: lo que se le añade se puede volver a
  // leer. Sin eso «sigue oculto» no se podría afirmar — se estaría probando el
  // localStorage y nada más.
  const playlistOcultos = { id: 'pl-ocultos-artistas', name: 'fonoteca · ocultos (recomendados)', owner: { id: 'usuario-banco' }, items: [] };
  const porUri = new Map();
  for (const t of likes) porUri.set(t.track.uri, t.track);

  sim.ruta('GET', /^\/me$/, () => ({ id: 'usuario-banco', display_name: 'Banco' }));
  sim.ruta('GET', /^\/me\/tracks/, ({ url }) => {
    const off = +url.searchParams.get('offset') || 0, lim = +url.searchParams.get('limit') || 50;
    return { items: likes.slice(off, off + lim), total: likes.length, next: off + lim < likes.length ? 'x' : null };
  });
  sim.ruta('GET', /^\/me\/playlists/, () => ({ items: [{ ...playlistOcultos, items: undefined }], total: 1, next: null }));
  sim.ruta('POST', /^\/me\/playlists/, () => ({ ...playlistOcultos, items: undefined }));
  sim.ruta('GET', /^\/playlists\/[^/?]+\?/, () => ({ id: playlistOcultos.id, name: playlistOcultos.name, owner: playlistOcultos.owner, snapshot_id: 's' + playlistOcultos.items.length }));
  sim.ruta('GET', /^\/playlists\/[^/]+\/items/, () => ({
    items: playlistOcultos.items.map(uri => ({ added_at: '2026-01-01T00:00:00Z', item: porUri.get(uri) || { uri, id: uri.split(':').pop(), type: 'track', artists: [], album: null } })),
    total: playlistOcultos.items.length, next: null,
  }));
  sim.ruta('POST', /^\/playlists\/[^/]+\/items/, ({ cuerpo }) => {
    for (const u of (cuerpo?.uris || [])) if (!playlistOcultos.items.includes(u)) playlistOcultos.items.push(u);
    return { snapshot_id: 's' + playlistOcultos.items.length };
  });
  // ⚠️ El cuerpo del DELETE es `{ items: [{ uri }] }` — la forma POST-migración
  // que manda `removeTracksFromPlaylist` (api.js). Con `{ tracks }` (la de antes
  // de febrero de 2026) el doble aceptaba la llamada y no borraba nada: la
  // prueba de «volver a mostrar» pasaba por el localStorage y la playlist se
  // quedaba con la pista, que es justo el fallo que hay que poder ver.
  sim.ruta('DELETE', /^\/playlists\/[^/]+\/items/, ({ cuerpo }) => {
    const fuera = new Set((cuerpo?.items || []).map(t => t.uri));
    playlistOcultos.items = playlistOcultos.items.filter(u => !fuera.has(u));
    return { snapshot_id: 's' + playlistOcultos.items.length };
  });
  // El contexto de filtros de #discover-artists lee la biblioteca de álbumes. No
  // es parte de lo que se prueba acá, pero sin el doble la vista escribe un
  // console.warn y el banco lo cuenta como ruta sin simular — con razón: una
  // ruta que nadie declaró es una que nadie miró.
  sim.ruta('GET', /^\/me\/albums/, () => ({ items: [], total: 0, next: null }));
  // #follow-artists: a quién sigues. Nadie, para que los cuatro salgan en la lista.
  sim.ruta('GET', /^\/me\/library\/contains/, ({ url }) =>
    url.searchParams.get('uris').split(',').map(() => false));
  // #similar resuelve top tracks por /search; devolvemos un match real para que
  // la uri representativa exista (y el aviso de «solo en este navegador» no salte).
  sim.ruta('GET', /^\/search/, ({ url }) => {
    const qq = url.searchParams.get('q') || '';
    const m = /artist:"([^"]+)"/.exec(qq);
    const nombre = m ? m[1] : 'Artista de ejemplo A';
    const t = likes.find(l => l.track.artists[0].name.toLowerCase() === nombre.toLowerCase())?.track;
    if (url.searchParams.get('type') === 'artist') {
      return { artists: { items: ARTISTAS.map(a => ({ ...a, genres: ['prueba'] })), total: ARTISTAS.length } };
    }
    return { tracks: { items: t ? [t] : [], total: t ? 1 : 0, next: null } };
  });
  // Last.fm, declarado como doble externo (ver simulado.mjs): #similar no toca la red.
  sim.rutaExterna(/ws\.audioscrobbler\.com/, ({ url }) => {
    const metodo = new URL(url).searchParams.get('method');
    if (metodo === 'artist.getsimilar') {
      return { similarartists: { artist: ARTISTAS.slice(1).map((a, i) => ({ name: a.name, match: String(0.9 - i * 0.1), image: [] })) } };
    }
    if (metodo === 'artist.gettoptracks') {
      const art = new URL(url).searchParams.get('artist');
      return { toptracks: { track: [{ name: `Tema 1 de ${art.slice(-1)}`, artist: { name: art }, playcount: '100' }] } };
    }
    return {};
  });

  // ── Sembrar lo que las vistas leen de disco ─────────────────────────────────
  const { prefKey } = await import('/js/storage.js');
  const { idbSetCached } = await import('/js/idb.js');
  const { crearBase, DISCO_BASE_PREFIX } = await import('/js/util/disco-base.js');
  localStorage.setItem('fonoteca_last_user_id', 'usuario-banco');
  // ⚠️ Animaciones APAGADAS, y no es cosmético: es lo que hace que este banco
  // sea determinista.
  //
  // `ui/reveal.js` arma un `setTimeout` por tarjeta revelada, con su retardo
  // escalonado. Bajo `--virtual-time-budget` esos retardos se cobran del
  // presupuesto de golpe, y `#discover-artists` sola se comía ~78 s de reloj
  // virtual pintando su lista (medido el 06/10 con hitos de
  // `performance.now()`). Resultado: el banco pasaba 1 de 3 veces. Con el modo
  // en 'nunca', `reveal` no arma ni un temporizador. Acá no se prueban las
  // animaciones, se prueba ocultar un artista.
  localStorage.setItem(prefKey('fonoteca_anim_v1'), 'nunca');
  await anclar(idbSetCached('all_liked_tracks', likes, null));
  for (const a of ARTISTAS) {
    const items = [1, 2].map(i => ({
      id: `r-${a.id}-${i}`, name: `Lanzamiento ${i} de ${a.name.slice(-1)}`, type: 'album', img: null,
      release: '2025-06-0' + i, total: 9, artists: [{ id: a.id, name: a.name }],
    }));
    await anclar(idbSetCached(`${DISCO_BASE_PREFIX}${a.id}`, crearBase(items, { fuente: 'nativo', cortada: false }), null));
  }

  const tienda = await import('/js/features/artistas-ocultos.js');
  afirmar(tienda.artistasOcultos.size === 0, `el banco arranca sin ocultos (hay ${tienda.artistasOcultos.size})`);

  // El menú ⋮ se abre y se elige «Ocultar este artista» / «Devolver a la lista».
  // Se usa el BOTÓN, como lo usaría Ian: si el botón no estuviera o no abriera,
  // esto falla — que es exactamente lo que hay que vigilar.
  async function porElMenu(raiz, nombre) {
    const btn = $$('.art-oc-menu-btn', raiz).find(b => b.dataset.artOc === nombre);
    afirmar(btn, `hay un botón ⋮ para «${nombre}» (los que hay: ${$$('.art-oc-menu-btn', raiz).map(b => b.dataset.artOc).join(', ') || 'ninguno'})`);
    afirmar(getComputedStyle(btn).display !== 'none' && btn.getBoundingClientRect().width > 0,
      `el botón ⋮ de «${nombre}» se VE sin pasar el ratón`);
    btn.click();
    const item = await esperarA(() => $('.art-oc-menu:not([hidden]) .art-oc-menu-item'), { que: 'que el menú ⋮ se abra' });
    const rotulo = item.textContent.trim();
    item.click();
    return rotulo;
  }

  // ══ 1. #follow-artists — podar la lista (punto 13) ═════════════════════════
  const follow = await import('/js/features/follow-artists.js');
  let suelta = follow.render(main());
  await esperarA(() => $$('.sel-art-item').length === ARTISTAS.length, { que: 'los 4 artistas de #follow-artists' });

  const nombresFollow = () => $$('.sel-art-name').map(e => e.textContent.trim());
  const antesFollow = nombresFollow();
  afirmar(antesFollow.length === 4, `#follow-artists lista 4 (lista ${antesFollow.length})`);
  afirmar(!$('#follow-ocultos'), 'sin ocultos, el botón de la barra NO gasta sitio');

  const victima = ARTISTAS[0].name;
  const rotulo1 = await porElMenu(main(), victima);
  afirmar(rotulo1 === 'Ocultar este artista', `el menú ofrece ocultar (dice «${rotulo1}»)`);
  await esperarA(() => nombresFollow().length === 3, { que: `que «${victima}» salga de la lista` });
  afirmar(!nombresFollow().includes(victima), `«${victima}» ya no está en la lista`);
  afirmar(tienda.artistasOcultos.size === 1, `contador: 1 oculto (hay ${tienda.artistasOcultos.size})`);
  const btnOcFollow = await esperarA(() => $('#follow-ocultos'), { que: 'el botón «Artistas ocultos» de #follow-artists' });
  afirmar(/\b1\b/.test(btnOcFollow.textContent), `el botón dice 1: «${btnOcFollow.textContent.trim()}»`);
  medidas.push(`#follow-artists: 4 → 3 en pantalla, contador 0 → 1`);

  // La pista representativa tiene que haber llegado a la playlist, y tiene que
  // ser una pista de ESE artista que ya estaba en los likes: 0 peticiones.
  await esperarA(() => playlistOcultos.items.length === 1, { que: 'que la pista representativa llegue a la playlist' });
  const repUri = playlistOcultos.items[0];
  afirmar(porUri.get(repUri)?.artists?.[0]?.name === victima,
    `la pista representativa es de «${victima}» (es de «${porUri.get(repUri)?.artists?.[0]?.name}»)`);
  afirmar(!window.__cons.some(c => /no pude resolver una pista/.test(c)),
    `no saltó el aviso de «queda oculto SOLO en este navegador»: ${window.__cons.join(' || ').slice(0, 300)}`);

  // Ver los ocultos y devolverlo
  btnOcFollow.click();
  await esperarA(() => nombresFollow().length === 1 && nombresFollow()[0] === victima, { que: 'la lista de ocultos' });
  const rotulo2 = await porElMenu(main(), victima);
  afirmar(rotulo2 === 'Devolver a la lista', `estando oculto, el menú ofrece devolver (dice «${rotulo2}»)`);
  await esperarA(() => tienda.artistasOcultos.size === 0, { que: 'que el contador vuelva a 0' });
  await esperarA(() => playlistOcultos.items.length === 0, { que: 'que la pista salga de la playlist' });
  medidas.push('#follow-artists: devolver → contador 1 → 0 y la pista sale de la playlist');
  if (VISTA === 'follow') throw Object.assign(new Error('follow'), { parada: true });
  limpiarVista(suelta);

  // ══ 2. #discover-artists — el bloque entero (punto 12) ═════════════════════
  const disco = await import('/js/features/discover-artists.js');
  suelta = await disco.render(main());
  await esperarA(() => $$('.disco-artist').length === ARTISTAS.length, { que: 'los 4 bloques de #discover-artists' });

  const bloques = () => $$('.disco-artist-name').map(e => e.textContent.trim());
  afirmar(bloques().length === 4, `#discover-artists pinta 4 bloques (pinta ${bloques().length})`);

  // LA BARRA, sin el botón y con él. Es la medición que el encargo pedía.
  const barraSin = filasDe('.disco-controls');
  afirmar(!$('#disco-mode-artistas'), 'sin ocultos no hay botón de artistas en la barra');

  const rotulo3 = await porElMenu(main(), victima);
  afirmar(rotulo3 === 'Ocultar este artista', `#discover-artists ofrece ocultar (dice «${rotulo3}»)`);
  await esperarA(() => bloques().length === 3, { que: `que el BLOQUE de «${victima}» desaparezca` });
  afirmar(!bloques().includes(victima), `el bloque de «${victima}» se fue entero, no álbum por álbum`);
  afirmar(tienda.artistasOcultos.size === 1, `contador: 1 (hay ${tienda.artistasOcultos.size})`);
  const btnOcDisco = await esperarA(() => $('#disco-mode-artistas'), { que: 'el botón «Artistas ocultos» de la barra' });
  const barraCon = filasDe('.disco-controls');
  medidas.push(`#discover-artists: 4 → 3 bloques · barra ${barraSin.filas} fila a ${ANCHO} px antes Y después del control (y con el contador en 183)`);
  // ⚠️ LA AFIRMACIÓN QUE MANDA: el control NO puede cambiar la barra.
  //
  // Es el freno que el encargo del 06/10 nombraba, y la primera versión lo
  // tocaba: con el botón dentro de `.disco-controls`, a **1.356 px** —el ancho
  // real de `main` en la pantalla de 1.366 de Ian— la barra pasaba a DOS FILAS
  // con el contador de tres cifras. Por eso el control vive en su propia línea.
  //
  // No se afirma «la barra entra en una fila» (eso ya lo vigila barra.html para
  // #new-releases): se afirma que es la MISMA barra antes y después, con el
  // contador en su peor caso. Un botón nuevo en esa barra hace fallar esto.
  btnOcDisco.querySelector('.art-oc-n').textContent = '183';
  const barraPeor = filasDe('.disco-controls');
  afirmar(barraCon.filas === barraSin.filas && barraPeor.filas === barraSin.filas,
    `el control de artistas ocultos cambió la barra de #discover-artists a ${ANCHO} px: `
    + `${barraSin.filas} fila(s) sin él, ${barraCon.filas} con él, ${barraPeor.filas} con el contador en 183. `
    + `Tiene que vivir FUERA de .disco-controls.\n  ${barraPeor.detalle}`);
  afirmar($('.disco-linea-artistas')?.contains(btnOcDisco),
    'el control vive en su propia línea, no en .disco-controls');
  afirmar(!$('.disco-controls')?.contains(btnOcDisco),
    'el control NO está dentro de .disco-controls (ahí rompe la barra a 1.356 px)');
  btnOcDisco.querySelector('.art-oc-n').textContent = '1';

  if (PASO === 'oculto' || VISTA === 'disco') throw Object.assign(new Error('disco oculto'), { parada: true });

  // El modo «Artistas ocultos» es desde donde se devuelve
  btnOcDisco.click();
  await esperarA(() => bloques().length === 1 && bloques()[0] === victima, { que: 'el modo de artistas ocultos' });
  const rotulo4 = await porElMenu(main(), victima);
  afirmar(rotulo4 === 'Devolver a la lista', `#discover-artists ofrece devolver (dice «${rotulo4}»)`);
  await esperarA(() => tienda.artistasOcultos.size === 0, { que: 'que el contador vuelva a 0' });
  medidas.push('#discover-artists: devolver → contador 1 → 0');
  limpiarVista(suelta);

  // ══ 3. #similar — la rejilla (punto 10) ═══════════════════════════════════
  const { setKey } = await import('/js/api/lastfm.js');
  setKey('clave-de-mentira-del-banco-1234');
  const similar = await import('/js/features/similar-artists.js');
  suelta = similar.render(main());
  $('#similar-search-input').value = ARTISTAS[0].name;
  $('#similar-search-input').dispatchEvent(new Event('input'));
  const resultado = await esperarA(() => $('.similar-search-item'), { que: 'los resultados de la búsqueda de artista' });
  resultado.click();
  await esperarA(() => $$('.art-card-pick').length === 3, { que: 'la rejilla de similares' });

  const rejilla = () => $$('.art-card-pick .smart-card-title').map(e => e.textContent.trim());
  afirmar(rejilla().length === 3, `#similar pinta 3 similares (pinta ${rejilla().length})`);
  // La tarjeta NO puede ser un botón dentro de otro
  afirmar($$('.art-card-pick-wrap button button').length === 0, 'no hay un botón dentro de otro en la tarjeta');

  const victima2 = rejilla()[0];
  const rotulo5 = await porElMenu(main(), victima2);
  afirmar(rotulo5 === 'Ocultar este artista', `#similar ofrece ocultar (dice «${rotulo5}»)`);
  await esperarA(() => rejilla().length === 2, { que: `que «${victima2}» salga de la rejilla` });
  afirmar(tienda.artistasOcultos.size === 1, `contador: 1 (hay ${tienda.artistasOcultos.size})`);
  // ⚠️ El camino SIN uri sugerida, que es el de #similar: acá nadie resolvió los
  // top tracks del artista todavía, así que la pieza compartida tiene que
  // BUSCARLA. `recuperarUriDeArtistaKey` devuelve `{ uri, motivo, … }`, no una
  // cadena, y pasar el objeto entero al `toggle` guardaría un objeto donde va un
  // `spotify:track:…` sin que nada se queje. Este assert es el que lo caza.
  await esperarA(() => playlistOcultos.items.length === 1, { que: 'que la uri buscada llegue a la playlist' });
  const uriSimilar = playlistOcultos.items[0];
  afirmar(typeof uriSimilar === 'string' && /^spotify:track:[A-Za-z0-9-]+$/.test(uriSimilar),
    `lo que llegó a la playlist es una uri de pista, no un objeto: ${JSON.stringify(uriSimilar)}`);
  afirmar(porUri.get(uriSimilar)?.artists?.[0]?.name?.toLowerCase() === victima2.toLowerCase(),
    `y es una pista de «${victima2}» (es de «${porUri.get(uriSimilar)?.artists?.[0]?.name}»)`);
  afirmar(!window.__cons.some(c => /no pude resolver una pista/.test(c)),
    `#similar resolvió la uri: no saltó «queda oculto SOLO en este navegador» — ${window.__cons.join(' || ').slice(0, 300)}`);
  medidas.push(`#similar: 3 → 2 en la rejilla, contador 0 → 1, uri buscada y subida a la playlist`);
  if (VISTA === 'similar') throw Object.assign(new Error('similar'), { parada: true });

  // ══ 4. EL MISMO ALMACÉN: ocultar en #similar se ve en las otras dos ════════
  //
  // Esto es lo que un test estático no puede afirmar. Si cada vista tuviera su
  // copia del almacén —o su propia clave— los tres contadores irían por
  // separado y nadie lo notaría hasta usar dos vistas seguidas.
  limpiarVista(suelta);
  suelta = await disco.render(main());
  await esperarA(() => $$('.disco-artist').length > 0, { que: 'que #discover-artists vuelva' });
  afirmar(!bloques().includes(victima2),
    `lo oculto en #similar («${victima2}») NO aparece en #discover-artists — bloques: ${bloques().join(', ')}`);
  const nDisco = $('#disco-mode-artistas')?.textContent || '';
  afirmar(/\b1\b/.test(nDisco), `#discover-artists lee el mismo contador: «${nDisco.trim()}»`);
  medidas.push(`las tres comparten el almacén: ocultado en #similar, filtrado en #discover-artists`);

  // ══ 5. LA RECARGA (ver la nota de la cabecera) ════════════════════════════
  const guardado = JSON.parse(localStorage.getItem(prefKey('recs_ocultos')) || '[]');
  afirmar(guardado.includes(victima2.toLowerCase()),
    `localStorage guarda la clave en minúsculas: ${JSON.stringify(guardado)}`);
  afirmar(playlistOcultos.items.length === 1, `la playlist espejo tiene 1 pista (tiene ${playlistOcultos.items.length})`);
  // Instancia NUEVA del módulo: su caché de claves nace vacío y lee el disco,
  // igual que en una sesión de página nueva.
  const deNuevo = await import('/js/features/artistas-ocultos.js?recarga=1');
  afirmar(deNuevo.artistasOcultos !== tienda.artistasOcultos, 'la instancia es NUEVA (si no, esto no prueba nada)');
  afirmar(deNuevo.artistaEstaOculto(victima2),
    `con el módulo recargado de cero, «${victima2}» sigue oculto`);
  afirmar(deNuevo.cuantosArtistasOcultos() === 1, `y el contador sigue en 1 (da ${deNuevo.cuantosArtistasOcultos()})`);
  medidas.push('tras recargar el módulo de cero: sigue oculto y el contador sigue en 1');

  // ══ 6. 0 reales ═══════════════════════════════════════════════════════════
  afirmar(sim.reg.externas.length === 0, `nada salió a la red sin doble: ${sim.reg.externas.join(' | ')}`);
  afirmar(sim.reg.desconocidas.length === 0, `ninguna ruta quedó sin simular: ${sim.reg.desconocidas.join(' | ')}`);
  const escrituras = sim.reg.escrituras.map(e => `${e.metodo} ${e.ruta.split('?')[0]}`);
  const permitidas = /^(POST|DELETE) \/playlists\/[^/]+\/items$|^POST \/me\/playlists$/;
  afirmar(sim.reg.escrituras.every(e => permitidas.test(`${e.metodo} ${e.ruta.split('?')[0]}`)),
    `solo se escribió en la playlist de ocultos: ${JSON.stringify(escrituras)}`);

  listo(`${medidas.join(' · ')} · ${sim.reg.llamadas.length} peticiones simuladas, 0 reales`);
} catch (e) {
  if (e.parada) {
    document.documentElement.dataset.banco = 'ok';
    document.title = 'BANCO: detenido en ' + e.message;
  } else {
    const r = window.__sim?.reg;
    if (r) e.message += `\n[llamadas ${r.llamadas.length}] desconocidas: ${r.desconocidas.join(' | ') || '—'} · externas: ${r.externas.join(' | ') || '—'}\nmedido: ${medidas.join(' · ') || '—'}\nconsola: ${window.__cons.join(' || ').slice(0, 600)}\nvisible: ${(document.querySelector('#main-content')?.textContent || '').replace(/\s+/g, ' ').slice(0, 300)}`;
    fallar(e);
  }
}
</script></body></html>
